services:
  web:
    image: python:3.12-slim
    working_dir: /app
    command: python -m http.server 3000 --bind 0.0.0.0
    volumes:
      - .:/app:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 3s
