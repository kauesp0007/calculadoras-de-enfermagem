<style>
:root{--navy:#1a3e74;--navy-light:#1e4d8c;--navy-dark:#163269}
.meem-card-navy{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 60%,var(--navy-dark) 100%);border-radius:16px;box-shadow:0 8px 24px rgba(26,62,116,.35);overflow:hidden;position:relative}

.prova-card{transition:transform .25s ease,box-shadow .25s ease;animation:fadeIn .4s ease forwards;opacity:0}

.btn-download{background:rgba(26,62,116,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(26,62,116,.3);transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}

.btn-gabarito{background:#fff;color:#475569;border:2px solid #cbd5e1;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.1);transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-gabarito:hover{background:#f8fafc;border-color:#94a3b8;box-shadow:0 8px 22px rgba(0,0,0,.15);transform:translateY(-1px);color:#475569;text-decoration:none}
