/*! ================================
CALCULADORA PADRÃO (ce-calc)
================================ */
.ce-calc {
width: 100%;
max-width: 320px;
margin-inline: auto;
padding: 14px;
border-radius: 22px;
background: linear-gradient(180deg, #ffffff 0%, #efeeec 100%);
border: 1px solid rgba(0, 0, 0, 0.06);
box-shadow:
0 18px 32px rgba(15, 23, 42, 0.14),
0 6px 12px rgba(15, 23, 42, 0.08),
inset 0 2px 0 rgba(255, 255, 255, 0.8),
inset 0 -14px 20px rgba(0, 0, 0, 0.04);
position: relative;
}

.ce-calc::after {
content: "";
position: absolute;
inset: 10px;
border-radius: 18px;
pointer-events: none;
box-shadow:
inset 0 0 0 1px rgba(0, 0, 0, 0.045),
inset 0 12px 18px rgba(255, 255, 255, 0.22),
inset 0 -12px 18px rgba(0, 0, 0, 0.04);
}

.ce-screen {
border-radius: 18px;
padding: 12px 12px;
min-height: 66px;
background: linear-gradient(180deg, #46abd7 0%, #6cc6ea 50%, #46abd7 100%);
border: 3px solid rgba(15, 23, 42, 0.22);
box-shadow:
inset 0 10px 18px rgba(255, 255, 255, 0.2),
inset 0 -12px 16px rgba(0, 0, 0, 0.1),
0 6px 10px rgba(15, 23, 42, 0.1);
user-select: none;
}

.ce-expr {
font-size: 13px;
line-height: 1.1;
color: rgba(10, 18, 30, 0.72);
overflow-wrap: anywhere;
}

.ce-result {
margin-top: 8px;
font-size: 28px;
font-weight: 800;
text-align: right;
color: rgba(10, 18, 30, 0.92);
}

.ce-keys {
margin-top: 14px;
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
}

.ce-key {
border: 0;
border-radius: 18px;
height: 52px;
padding: 0 8px;
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
font-weight: 800;
color: rgba(255, 255, 255, 0.92);
background: linear-gradient(180deg, #6b748a 0%, #586170 55%, #4b5262 100%);
box-shadow:
0 12px 16px rgba(15, 23, 42, 0.14),
inset 0 3px 0 rgba(255, 255, 255, 0.16),
inset 0 -7px 0 rgba(0, 0, 0, 0.26);
cursor: pointer;
user-select: none;
-webkit-tap-highlight-color: transparent;
transform: translateZ(0);
}

.ce-key:active {
transform: translateY(1px);
box-shadow:
0 8px 12px rgba(15, 23, 42, 0.12),
inset 0 2px 0 rgba(255, 255, 255, 0.14),
inset 0 -5px 0 rgba(0, 0, 0, 0.24);
}

.ce-op {
background: linear-gradient(180deg, #556aa1 0%, #425584 55%, #394876 100%);
}

.ce-danger {
background: linear-gradient(180deg, #8b5b5b 0%, #7a4343 55%, #633636 100%);
}

.ce-zero {
grid-column: span 2;
}

.ce-tall {
grid-row: span 2;
height: calc(52px * 2 + 10px);
font-size: 28px;
}

@media (max-width: 360px) {
.ce-calc {
max-width: 290px;
padding: 12px;
border-radius: 20px;
}

.ce-key {
height: 48px;
border-radius: 16px;
}

.ce-tall {
height: calc(48px * 2 + 10px);
}

.ce-result {
font-size: 26px;
}
}

@media (prefers-reduced-motion: reduce) {
.ce-key {
transition: none;
}
}
