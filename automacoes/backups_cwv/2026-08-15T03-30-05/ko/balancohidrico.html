<script>
(function(){
"use strict";

var ITENS_BH=[
{id:"ingestaoOral",label:"경구",tipo:"entrada",max:5000,desc:"경구로 섭취한 액체."},
{id:"ingestaoSonda",label:"장관 튜브를 통한",tipo:"entrada",max:5000,desc:"장관 튜브로 주입된 액체."},
{id:"ingestaoParenteral",label:"정맥 주사 (IV)",tipo:"entrada",max:5000,desc:"정맥으로 주입된 액체."},
{id:"ingestaoOutros",label:"기타 입력",tipo:"entrada",max:5000,desc:"기타 액체 섭취원."},
{id:"eliminacaoUrina",label:"소변",tipo:"saida",max:5000,desc:"배출된 소변의 양."},
{id:"eliminacaoVomito",label:"구토",tipo:"saida",max:5000,desc:"구토로 잃은 양."},
{id:"eliminacaoDrenos",label:"배액",tipo:"saida",max:5000,desc:"장치로 배출된 양."},
{id:"eliminacaoOutros",label:"기타 출력",tipo:"saida",max:5000,desc:"기타 액체 손실."}
];

var calcBalanco=0,calcClasse="",calcBg="",calcConduta="";

function renderizarForm(){
var c=document.getElementById("bhForm");c.innerHTML="";
ITENS_BH.forEach(function(item){
var div=document.createElement("div");div.className="item-card";
div.innerHTML='<div class="flex items-center justify-between mb-2"><label for="'+item.id+'" class="text-[13px] font-bold text-slate-800">'+item.label+'</label><span id="badge_'+item.id+'" class="item-badge">0 mL</span></div><p class="text-[11px] text-slate-500 mb-3 leading-snug h-8">'+item.desc+'</p><input type="number" id="'+item.id+'" placeholder="0" class="input-strong" style="text-transform:none;font-weight:600" min="0" max="'+item.max+'"/><div class="mini-bar-wrap"><div id="bar_'+item.id+'" class="mini-bar-fill" style="width:0%"></div></div>';
c.appendChild(div);
document.getElementById(item.id).addEventListener("input",function(){atualizarCard(item.id);});
document.getElementById(item.id).addEventListener("wheel",function(e){e.preventDefault();this.blur();});
});
}

function atualizarCard(id){
var el=document.getElementById(id),val=parseFloat(el.value)||0;
var item=ITENS_BH.find(function(i){return i.id===id;});
var pct=Math.min((val/5000)*100,100);
var badge=document.getElementById("badge_"+id),bar=document.getElementById("bar_"+id);
badge.textContent=val+" mL";
if(item.tipo==="entrada"){bar.style.backgroundColor="#0284c7";badge.style.color="#0284c7";badge.style.borderColor="#0284c7";badge.style.background="#e0f2fe";}
else{bar.style.backgroundColor="#d97706";badge.style.color="#d97706";badge.style.borderColor="#d97706";badge.style.background="#fffbeb";}
bar.style.width=pct+"%";atualizarGlobais();
}

function atualizarGlobais(){
var p=0;ITENS_BH.forEach(function(i){if(parseFloat(document.getElementById(i.id).value)>0)p++;});
document.getElementById("progress-bar-global").style.width=((p/8)*100)+"%";
document.getElementById("contadorPreenchidos").textContent=p;
}

document.getElementById("btnToggleDados").addEventListener("click",function(){
var b=document.getElementById("dadosBody"),c=document.getElementById("dadosChevron"),s=document.getElementById("dadosSubtitle");
if(b.classList.contains("open")){b.classList.remove("open");c.style.transform="rotate(0deg)";s.textContent="진료기록/보고서 PDF에 입력하기";this.style.background="white";}
else{b.classList.add("open");c.style.transform="rotate(180deg)";s.textContent="패널 숨기기";this.style.background="#EFF6FF";}
});

async function chamarNanda(){
var lista=document.getElementById("lista-nanda");
lista.innerHTML='<li class="text-sm text-slate-500 text-center py-4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="fa-spin mr-2" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M304 48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zm0 416a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM48 304a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm464-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0zM142.9 437A48 48 0 1 0 75 369.1 48 48 0 1 0 142.9 437zm0-294.2A48 48 0 1 0 75 75a48 48 0 1 0 67.9 67.9zM369.1 437A48 48 0 1 0 437 369.1 48 48 0 1 0 369.1 437z"/></svg>NANDA-I 데이터베이스 조회 중...</li>';
try{
var resp=await fetch("/banco_nanda_en.json");if(!resp.ok)throw new Error("오류");var banco=await resp.json();
var kw=["volume","líquido","hidratação","eliminação","urinária","edema","débito","perfusão","eletrólito"];
if(calcBalanco>0)kw.push("edema","sobrecarga","excesso","hipertensão");
else if(calcBalanco<0)kw.push("desidratação","déficit","hipotensão","mucosa","turgescência");
var pont=banco.map(function(d){var s=0;var t=(d.diagnostico+" "+d.definicao).toLowerCase();kw.forEach(function(k){if(t.includes(k))s++;});return{diagnostico:d.diagnostico,definicao:d.definicao,codigo:d.codigo,matchScore:s};}).filter(function(d){return d.matchScore>0;});
pont.sort(function(a,b){return b.matchScore-a.matchScore;});
var temas=new Set(),top=[];
function extrairTema(tit){var t=tit.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");["~의 위험","~할 의향이","~에 대한 의지","~ 증후군"].forEach(function(p){if(t.startsWith(p)){t=t.slice(p.length).trim();}});
var palavras=t.split(/\s+/).filter(function(w){return w.length>3&&!["para","com","sem","como","dos","das","que","não","nao","adulto","criança","idoso","lactente"].includes(w);});return palavras.slice(0,4).join(" ");}
for(var i=0;i<pont.length&&top.length<5;i++){var tema=extrairTema(pont[i].diagnostico);if(!temas.has(tema)){temas.add(tema);top.push(pont[i]);}}
if(top.length>0){lista.innerHTML="";top.forEach(function(d){lista.innerHTML+='<li class="nanda-item flex items-start gap-3"><span class="bg-blue-100 text-blue-800 text-[10px] font-black px-2 py-1 rounded shadow-sm mt-0.5">'+d.codigo+'</span><div><h5 class="text-[13px] font-bold text-slate-800 leading-tight mb-1">'+d.diagnostico+'</h5><p class="text-[11px] text-slate-500 leading-snug m-0">'+d.definicao+'</p></div></li>';});}
else{lista.innerHTML='<li class="text-xs text-slate-500 text-center py-4">수분 균형과 직접적으로 관련된 진단은 발견되지 않았습니다.</li>';}
}catch(e){lista.innerHTML='<li class="text-xs text-red-500 text-center py-4">NANDA 은행을 이용할 수 없습니다.</li>';}
}
