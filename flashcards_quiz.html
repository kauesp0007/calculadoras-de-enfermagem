<style>
/*! Estilos do Flashcard 3D */
.flashcard-container {
perspective: 1200px;
width: 100%;
height: 540px; /*! Altura exata definida para igualar à calculadora */
}

.flashcard {
position: relative;
width: 100%;
height: 100%;
cursor: pointer;
transform-style: preserve-3d;
transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
border-radius: 24px;
box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15); /*! Sombra no card inteiro */
}

.flashcard.flipped {
transform: rotateY(180deg);
}

/*! REMOVIDO pointer-events: none que causava o travamento! */
.flashcard.answered {
cursor: default; /*! Apenas muda o cursor para não parecer que vai virar de novo */
}

.card-front, .card-back {
position: absolute;
width: 100%;
height: 100%;
backface-visibility: hidden;
border-radius: 24px;
overflow-y: auto;
padding: 24px;
}

.card-front {
background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
border-top: 6px solid #1A3E74;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

.card-back {
background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
transform: rotateY(180deg);
border-bottom: 6px solid #4A90E2;
display: flex;
flex-direction: column;
}

/*! Barra de progresso e cronômetro */
.quiz-controls {
background: white;
border-radius: 60px;
padding: 8px 20px;
display: flex;
align-items: center;
gap: 20px;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
border: 1px solid #e5e7eb;
}

.progress-bar-container {
width: 150px;
height: 8px;
background: #e5e7eb;
border-radius: 10px;
overflow: hidden;
}

.progress-bar-fill {
height: 100%;
background: linear-gradient(90deg, #1A3E74, #4A90E2);
width: 0%;
transition: width 0.3s ease;
}

/*! Sidebar de thumbnails (Estreita e Vertical) */
.deck-sidebar {
background: white;
border-radius: 16px;
padding: 12px 0; /*! Padding apenas no eixo Y */
border: 1px solid #e5e7eb;
height: 540px; /*! Exatamente a mesma altura do flashcard */
width: 65px; /*! Largura fina e fixa */
overflow-y: auto;
display: flex;
flex-direction: column;
align-items: center;
gap: 8px;
}

/*! Esconder scrollbar na sidebar para estética limpa */
.deck-sidebar::-webkit-scrollbar {
display: none;
}
.deck-sidebar {
-ms-overflow-style: none;
scrollbar-width: none;
}

.thumb {
width: 42px;
height: 42px;
flex-shrink: 0; /*! Impede achatamento */
border-radius: 12px;
background: white;
border: 2px solid #e5e7eb;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 0.85rem;
cursor: pointer;
transition: all 0.2s;
}

.thumb.current {
background: #1A3E74;
color: white;
border-color: #1A3E74;
transform: scale(1.05);
}

.thumb.correct {
background: #10b981;
color: white;
border-color: #10b981;
}

.thumb.wrong {
background: #ef4444;
color: white;
border-color: #ef4444;
}

.option-btn {
width: 100%;
padding: 12px 16px;
border: 2px solid #e5e7eb;
border-radius: 12px;
background: white;
font-family: inherit;
font-weight: 600;
text-align: left;
cursor: pointer;
transition: all 0.2s;
margin-bottom: 8px;
}

.option-btn:hover:not(:disabled) {
border-color: #4A90E2;
background: #f0f7ff;
transform: translateX(4px);
}

.option-btn.correct {
background: #d1fae5;
border-color: #10b981;
color: #065f46;
}

.option-btn.wrong {
background: #fee2e2;
border-color: #ef4444;
color: #991b1b;
}

.next-btn {
width: 100%;
padding: 12px;
background: #1A3E74;
color: white;
border: none;
border-radius: 12px;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
margin-top: 16px;
}

.next-btn:hover {
background: #0f2652;
transform: translateY(-2px);
}

.feedback-area {
padding: 12px;
border-radius: 12px;
font-size: 0.85rem;
margin-top: 12px;
}

.feedback-area.correct {
background: #d1fae5;
color: #065f46;
}

.feedback-area.wrong {
background: #fee2e2;
color: #991b1b;
}

.result-overlay {
background: white;
border-radius: 24px;
padding: 32px;
text-align: center;
box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
border: 2px solid #1A3E74;
}

/*! ================================
CALCULADORA PADRÃO (ce-calc)
================================ */
.ce-calc{
width: 100%;
max-width: 320px;
margin-inline: auto;
padding: 14px;
border-radius: 22px;
background: linear-gradient(180deg, #ffffff 0%, #efeeec 100%);
border: 1px solid rgba(0,0,0,.06);
box-shadow:
0 18px 32px rgba(15, 23, 42, .14),
0 6px 12px rgba(15, 23, 42, .08),
inset 0 2px 0 rgba(255,255,255,.8),
inset 0 -14px 20px rgba(0,0,0,.04);
position: relative;
}
.ce-calc::after{
content:"";
position:absolute;
inset: 10px;
border-radius: 18px;
pointer-events:none;
box-shadow:
inset 0 0 0 1px rgba(0,0,0,.045),
inset 0 12px 18px rgba(255,255,255,.22),
inset 0 -12px 18px rgba(0,0,0,.04);
}
.ce-screen{
border-radius: 18px;
padding: 12px 12px;
min-height: 66px;
background: linear-gradient(180deg, #46abd7 0%, #6cc6ea 50%, #46abd7 100%);
border: 3px solid rgba(15, 23, 42, .22);
box-shadow:
inset 0 10px 18px rgba(255,255,255,.20),
inset 0 -12px 16px rgba(0,0,0,.10),
0 6px 10px rgba(15,23,42,.10);
user-select: none;
}
.ce-expr{
font-size: 13px;
line-height: 1.1;
color: rgba(10, 18, 30, .72);
overflow-wrap: anywhere;
}
.ce-result{
margin-top: 8px;
font-size: 28px;
font-weight: 800;
text-align: right;
color: rgba(10, 18, 30, .92);
}
.ce-keys{
margin-top: 14px;
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
}
.ce-key{
border: 0;
border-radius: 18px;
height: 52px;
padding: 0 8px;
display:flex;
align-items:center;
justify-content:center;
font-size: 18px;
font-weight: 800;
color: rgba(255,255,255,.92);
background: linear-gradient(180deg, #6b748a 0%, #586170 55%, #4b5262 100%);
box-shadow:
0 12px 16px rgba(15,23,42,.14),
inset 0 3px 0 rgba(255,255,255,.16),
inset 0 -7px 0 rgba(0,0,0,.26);
cursor: pointer;
user-select: none;
-webkit-tap-highlight-color: transparent;
transform: translateZ(0);
}
.ce-key:active{
transform: translateY(1px);
box-shadow:
0 8px 12px rgba(15,23,42,.12),
inset 0 2px 0 rgba(255,255,255,.14),
inset 0 -5px 0 rgba(0,0,0,.24);
}
.ce-op{
background: linear-gradient(180deg, #556aa1 0%, #425584 55%, #394876 100%);
}
.ce-danger{
background: linear-gradient(180deg, #8b5b5b 0%, #7a4343 55%, #633636 100%);
}
.ce-zero{ grid-column: span 2; }
.ce-tall{
grid-row: span 2;
height: calc(52px * 2 + 10px);
font-size: 28px;
}

@media (max-width: 768px) {
.quiz-controls { padding: 6px 16px; gap: 12px; }
.progress-bar-container { width: 100px; }
.card-front, .card-back { padding: 16px; }

/*! Em telas pequenas a sidebar volta a ficar horizontal em cima */
.deck-sidebar {
width: 100%;
height: auto;
flex-direction: row;
padding: 12px;
overflow-x: auto;
overflow-y: hidden;
}
#thumbnailsContainer {
flex-direction: row !important;
}
}

@media (max-width: 360px){
.ce-calc{ max-width: 290px; padding: 12px; border-radius: 20px; }
.ce-key{ height: 48px; border-radius: 16px; }
.ce-tall{ height: calc(48px * 2 + 10px); }
.ce-result{ font-size: 26px; }
}
@media (prefers-reduced-motion: reduce){
.ce-key{ transition: none; }
}
</style>
