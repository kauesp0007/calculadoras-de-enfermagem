<style>
/*! Formulário Carrinho CKO — CSS escopado */
#cko-form { --navy:#1A3E74; --ink:#172536; --line:#9DAABA; --soft:#EEF3F8; --warn:#FFF2D8; }
#cko-form .toolbar{position:sticky;top:60px;z-index:10;display:flex;gap:8px;justify-content:center;padding:10px;background:#102a4a}
#cko-form button,#cko-form a.btn{display:inline-block;border:0;border-radius:8px;padding:9px 13px;background:#fff;color:#102a4a;font-weight:bold;text-decoration:none;cursor:pointer}
#cko-form button.primary{background:#2B5B96;color:#fff}
#cko-form .form-page{position:relative;width:210mm;min-height:297mm;margin:10px auto;padding:10mm 10mm 15mm;background:#fff;page-break-after:always;box-shadow:0 10px 25px rgba(0,0,0,.12)}
#cko-form article header{display:grid;grid-template-columns:52mm 1fr;gap:8mm;align-items:center;padding-bottom:5mm;border-bottom:2px solid var(--navy)}
#cko-form article header img{width:50mm}
#cko-form article header span{color:var(--navy);font-size:6.5pt;font-weight:bold;text-transform:uppercase;letter-spacing:.06em}
#cko-form article h1{margin:1mm 0;color:var(--navy);font-size:17pt}
#cko-form article header p{margin:0;color:#526274}
#cko-form .warning{margin:4mm 0;padding:2.5mm;border:1px solid #d8ad55;background:var(--warn)}
#cko-form .block,#cko-form .cognitive,#cko-form .alert{margin-top:4mm}
#cko-form article h2{margin:0 0 2mm;padding:2mm 2.5mm;background:var(--navy);color:#fff;font-size:9pt}
#cko-form .fields{display:grid;grid-template-columns:repeat(2,1fr);gap:2mm}
#cko-form .field{min-height:13mm;padding:2mm;border:1px solid var(--line)}
#cko-form .field.span-2{grid-column:span 2}
#cko-form .field strong{display:block;margin-bottom:2mm;color:#415166;font-size:6.8pt;text-transform:uppercase}
#cko-form .line{display:block;min-height:5mm;border-bottom:1px solid #44566b}
#cko-form textarea{width:100%;min-height:19mm;border:0;resize:none}
#cko-form .options{display:flex;flex-wrap:wrap;gap:1.5mm 3mm;align-items:center}
#cko-form .box{display:inline-block;width:3.5mm;height:3.5mm;border:1px solid #333;vertical-align:middle}
#cko-form small,#cko-form .note{color:#647386;font-size:6.5pt}
#cko-form ul{margin:1.5mm 0 0;padding-left:5mm}
#cko-form li{margin:1mm 0}
#cko-form .cognitive h2{background:#315D8D}
#cko-form .alert h2{background:#8A1C1C}
#cko-form article footer{text-align:center;color:#9DAABA;font-size:6.5pt;margin-top:5mm;padding-top:2mm;border-top:1px solid var(--line)}
@media print{ #cko-form .toolbar{display:none} #cko-form .form-page{box-shadow:none;margin:0;page-break-after:always} }
@page{size:A4;margin:10mm}

/*! BARRA DE AÇÕES + RESET SVG (evita ícones gigantes) */
.ce-actionbar{margin:0 0 16px;display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ce-actionbar::-webkit-scrollbar{display:none}
.ce-action{display:inline-flex;align-items:center;gap:4px;border:1px solid #e2e8f0;background:#fff;color:#1A3E74;border-radius:999px;padding:0.38rem 0.62rem;font-weight:800;font-size:0.72rem;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s,background .15s,transform .15s;flex-shrink:0;line-height:1.2}
.ce-action:hover{border-color:rgba(74,144,226,.5);background:#eff6ff;transform:translateY(-1px)}
.ce-action svg{flex-shrink:0;width:0.85em!important;height:0.85em!important;max-width:0.85em!important;max-height:0.85em!important}
.ce-share-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999}
.ce-share-overlay.open{display:block}
.ce-share-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.35);z-index:10000;padding:22px 20px 18px;min-width:300px;text-align:center}
.ce-share-popup.open{display:block}
.ce-share-popup h4{margin:0 0 12px;color:#1A3E74;font-size:0.95rem;font-weight:900}
.ce-share-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:2px solid #e2e8f0;background:#fff;color:#1A3E74;border-radius:12px;padding:8px 14px;margin:3px;font-weight:800;font-size:0.8rem;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.ce-share-btn:hover{background:#eff6ff;border-color:#4A90E2}
.ce-share-close{margin-top:14px;padding:6px 18px;border-radius:999px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;font-weight:800;font-size:0.75rem;cursor:pointer}

/*! Reset SVG no main (evita ícones gigantes do Font Awesome) */
main svg:not(#cko-form svg){max-width:1.5em;max-height:1.5em;vertical-align:middle}
#cko-form svg{max-width:none;max-height:none}
