name: Extension Gasometry Tests

on:
  pull_request:
    paths:
      - "extensao-chrome/**"
      - "conta/extensao-login.html"
      - "js/auth/extension-login-bridge.js"
      - "js/auth/auth-ui.js"
      - "supabase/functions/extension-auth/**"
      - "supabase/functions/extension-access/**"
      - "supabase/migrations/*extension_auth_codes.sql"
      - ".github/workflows/extension-gasometry-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run gasometry extension tests
        working-directory: extensao-chrome
        run: npm test
      - name: Validate bridge and edge function syntax markers
        run: |
          node --check js/auth/extension-login-bridge.js
          grep -q "extension-auth" js/auth/extension-login-bridge.js
          grep -q "extension-access" extensao-chrome/service-worker.js
          grep -q "verify_jwt = false" supabase/config.toml
      - name: Build extension ZIP 0.3.2
        run: |
          zip -r calculadora-gasometria-arterial-0.3.2.zip extensao-chrome \
            -x "extensao-chrome/tests/*" \
            -x "extensao-chrome/README.md" \
            -x "extensao-chrome/VALIDACAO.md" \
            -x "extensao-chrome/PRIVACIDADE.md" \
            -x "extensao-chrome/INSTALAR.txt" \
            -x "extensao-chrome/package.json" \
            -x "extensao-chrome/empacotar.ps1" \
            -x "extensao-chrome/.gitignore"
      - name: Upload extension ZIP 0.3.2
        uses: actions/upload-artifact@v4
        with:
          name: gasometria-extension-0.3.2
          path: calculadora-gasometria-arterial-0.3.2.zip
          if-no-files-found: error
          retention-days: 1
