name: Estação de Enfermagem — Windows
on:
  pull_request:
    paths:
      - 'programas/estacao-enfermagem/**'
      - '.github/workflows/estacao-enfermagem-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: programas/estacao-enfermagem
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: programas/estacao-enfermagem
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: programas/estacao-enfermagem/package-lock.json
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Cálculo, segurança e persistência
        run: npm test
      - name: Electron e PDF nativos no Windows
        run: npm run test:ui
      - name: Gerar instalador Windows x64
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Registrar assinatura e hash dos executáveis
        shell: pwsh
        run: ./tools/verify-windows.ps1
      - name: Testar instalação e desinstalação silenciosas
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*Setup*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'Enfermagem-Install-Test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path "$target/Estação de Enfermagem.exe")) { throw 'App executable missing after installation' }
          $appFile = Join-Path $target 'Estação de Enfermagem.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $appFile).Status -ne 'NotSigned') { throw 'Assinatura inesperada na build de homologação' }
          node tests/installed.cjs "$target/Estação de Enfermagem.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed application test failed" }
          $uninstaller = Get-ChildItem $target/*Uninstall*.exe | Select-Object -First 1
          if (-not $uninstaller) { throw 'Uninstaller missing' }
          $result = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller failed: $($result.ExitCode)" }
      - name: Hash do instalador
        shell: pwsh
        run: Get-FileHash dist/*Setup*.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Estacao-Enfermagem-Windows-0.2.1
          path: |
            programas/estacao-enfermagem/dist/*Setup*.exe
            programas/estacao-enfermagem/dist/SHA256.txt
            programas/estacao-enfermagem/dist/ASSINATURA-WINDOWS.json
            programas/estacao-enfermagem/tests/artifacts/*
          retention-days: 14
