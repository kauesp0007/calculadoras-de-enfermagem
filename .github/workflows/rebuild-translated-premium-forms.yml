name: 🌐 Reconstruir formulários Premium EN/ES

on:
  push:
    branches:
      - main
    paths:
      - scripts/rebuild-translated-premium-forms.py
      - .github/workflows/rebuild-translated-premium-forms.yml

permissions:
  contents: write

concurrency:
  group: rebuild-translated-premium-forms
  cancel-in-progress: false

jobs:
  rebuild:
    environment: github-pages
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TRANSLATION_PROVIDER: deepseek
      TRANSLATION_MAX_FALLBACK: 3
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependências de tradução
        run: python -m pip install --upgrade pip requests python-dotenv

      - name: 🔐 Validar credenciais de reconstrução
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY}" || { echo "::error::DEEPSEEK_API_KEY não está disponível no ambiente github-pages."; exit 1; }
          test -n "${SUPABASE_URL}" || { echo "::error::SUPABASE_URL não está disponível no ambiente github-pages."; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY não está disponível no ambiente github-pages."; exit 1; }
          echo "Credenciais necessárias disponíveis."

      - name: 🌐 Reconstruir conteúdos completos EN/ES
        run: python scripts/rebuild-translated-premium-forms.py

      - name: 💾 Persistir formulários traduzidos completos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- en es; then
            echo "Nenhum formulário EN/ES foi alterado."
            exit 0
          fi
          git add en es
          git commit -m "fix(premium): restaurar conteúdo completo dos formulários EN/ES"
          git push origin HEAD:main
