name: 🚀 Deploy automático no GitHub Pages
# Reexecuta o pipeline após commits automatizados de conteúdo Premium traduzido.
# Trigger técnico: garante nova execução após reconstruções feitas por workflows automatizados.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  queue:
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - uses: actions/setup-node@v4
        if: github.event_name == 'schedule'
        with:
          node-version: 24
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/developer-premium-requests.mjs --check
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: queue
    if: needs.queue.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PREMIUM_REQUESTS_FILE: /tmp/premium-activation-requests.json
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 📚 Reconstruir Biblioteca de Enfermagem
        run: |
          node --check build-biblioteca.js
          node --check build-downloads.js
          node build-biblioteca.js
          node build.js

      - name: 🔐 Validar credenciais do catálogo Premium
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Secret SUPABASE_URL não está disponível no ambiente github-pages."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY não está disponível no ambiente github-pages."; exit 1; }

      - name: 📥 Ler solicitações de conversão Premium
        run: node scripts/developer-premium-requests.mjs --fetch

      - name: 📝 Regenerar formulários de escalas Premium
        run: |
          node --check _gerar_formularios_escalas.js
          node _gerar_formularios_escalas.js

      - name: 🧹 Centralizar carregamento do AdSense
        run: |
          node --check scripts/sanitize-direct-adsense-loaders.mjs
          node scripts/sanitize-direct-adsense-loaders.mjs

      - name: 🎨 Compilar Tailwind CSS
        run: ./node_modules/.bin/tailwindcss -i ./src/input.css -o ./public/output.css --minify

      - name: 🗺️ Gerar Sitemap
        run: node generate-sitemap.js

      - name: 🧪 Validar scripts de proteção Premium
        run: |
          node --check scripts/shellify-premium-public-pages.mjs
          node --check js/access/premium-print-guard.js
          node --check scripts/ensure-premium-print-guard.mjs
          node --check scripts/validate-printable-scale-forms.mjs
          node --check scripts/test-english-assistential-previews.mjs
          node --check scripts/test-localized-assistential-catalog.mjs
          node --check scripts/migrate-premium-content.mjs
          node --check scripts/test-premium-auth-delivery-flow.js
          node --check scripts/test-premium-simulados-access.js
          node --check scripts/test-premium-content-access.js
          node --check scripts/auditar-bloqueio-escalas.js
          node --check scripts/test-premium-ads.js
          node --check scripts/test-developer-admin.js
          node --check scripts/generate-developer-route-catalog.mjs
          node --check scripts/test-developer-route-catalog.js
          node --check scripts/developer-premium-eligible.mjs
          node --check scripts/developer-premium-requests.mjs
          node scripts/test-developer-premium-activation.mjs
          node scripts/test-premium-ads.js
          node scripts/test-developer-admin.js
          node scripts/test-developer-route-catalog.js
          node scripts/test-english-assistential-previews.mjs
          node scripts/test-localized-assistential-catalog.mjs
          node --check scripts/test-account-pages.js

      - name: 🔬 Simular benefício com estado real do Supabase
        run: node scripts/test-premium-ads-real-state.mjs

      - name: 👤 Validar páginas da conta
        run: node scripts/test-account-pages.js

      - name: 🧪 Validar conteúdo bilíngue da Biblioteca e formulários
        run: node scripts/validate-bilingual-library-forms.js

      - name: 🖨️ Proteger impressão para usuários Free
        run: |
          node scripts/ensure-premium-print-guard.mjs --apply
          node scripts/ensure-premium-print-guard.mjs --audit

      - name: 🔐 Sincronizar conteúdo Premium no catálogo privado
        run: |
          node scripts/migrate-premium-content.mjs --apply
          test -s premium-content-inventory.json

      - name: 🛡️ Validar fonte canônica dos 30 formulários
        run: node scripts/validate-printable-scale-forms.mjs

      - name: 🔒 Gerar shells das páginas Premium
        run: node scripts/shellify-premium-public-pages.mjs

      - name: 🔎 Validar shells públicos e SEO canônico dos formulários
        run: node scripts/validate-printable-scale-forms.mjs --public

      - name: 🔍 Auditar acesso Premium após shellificação
        run: |
          node scripts/test-premium-auth-delivery-flow.js
          node scripts/test-premium-simulados-access.js
          node scripts/test-premium-content-access.js

      - name: 🔐 Persistir shells Premium no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- '*.html'; then
            echo "Nenhuma página Premium precisou ser shellificada."
            exit 0
          fi
          git add -- '*.html'
          git commit -m "chore(access): proteger páginas Premium públicas"

          # A main pode avançar enquanto o deploy executa. Rebaseia o commit gerado
          # antes do push para nunca sobrescrever commits concorrentes.
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo "::error::Conflito real ao reaplicar os shells Premium sobre a main atual."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "::warning::A main avançou durante o push; nova tentativa segura ($attempt/3)."
          done
          test "$pushed" = "true" || { echo "::error::Não foi possível persistir os shells Premium após 3 tentativas."; exit 1; }

      - name: 📄 Atualizar catálogo de páginas do desenvolvedor
        run: node scripts/generate-developer-route-catalog.mjs

      - name: ⚙️ Gerar Service Worker
        run: node gerar-sw.js

      - name: 📤 Upload dos arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./
          retention-days: 1

      - name: 🚀 Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: ✅ Ativar rotas com shell publicado
        run: node scripts/developer-premium-requests.mjs --finalize
