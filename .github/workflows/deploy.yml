name: 🚀 Deploy automático no GitHub Pages
# Reexecuta o pipeline após commits automatizados de conteúdo Premium traduzido.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 📚 Reconstruir Biblioteca de Enfermagem
        run: |
          node --check build-biblioteca.js
          node --check build-downloads.js
          node build-biblioteca.js
          node build.js

      - name: 🔐 Validar credenciais do catálogo Premium
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Secret SUPABASE_URL não está disponível no ambiente github-pages."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY não está disponível no ambiente github-pages."; exit 1; }

      - name: 📝 Regenerar formulários de escalas Premium
        run: |
          node --check _gerar_formularios_escalas.js
          node _gerar_formularios_escalas.js


      - name: 🎨 Compilar Tailwind CSS
        run: ./node_modules/.bin/tailwindcss -i ./src/input.css -o ./public/output.css --minify

      - name: 🗺️ Gerar Sitemap
        run: node generate-sitemap.js

      - name: 🧪 Validar scripts de proteção Premium
        run: |
          node --check scripts/shellify-premium-public-pages.mjs
          node --check scripts/validate-printable-scale-forms.mjs
          node --check scripts/migrate-premium-content.mjs
          node --check scripts/test-premium-auth-delivery-flow.js
          node --check scripts/test-premium-simulados-access.js
          node --check scripts/test-premium-content-access.js
          node --check scripts/auditar-bloqueio-escalas.js
          node --check scripts/test-account-pages.js

      - name: 👤 Validar páginas da conta
        run: node scripts/test-account-pages.js

      - name: 🧪 Validar conteúdo bilíngue da Biblioteca e formulários
        run: node scripts/validate-bilingual-library-forms.js

      - name: 🔐 Sincronizar conteúdo Premium no catálogo privado
        run: |
          node scripts/migrate-premium-content.mjs --apply
          test -s premium-content-inventory.json

      - name: 🛡️ Validar fonte canônica dos 30 formulários
        run: node scripts/validate-printable-scale-forms.mjs


      - name: 🔒 Gerar shells das páginas Premium
        run: node scripts/shellify-premium-public-pages.mjs

      - name: 🔎 Validar shells públicos e SEO canônico dos formulários
        run: node scripts/validate-printable-scale-forms.mjs --public

      - name: 🔍 Auditar acesso Premium após shellificação
        run: |
          node scripts/test-premium-auth-delivery-flow.js
          node scripts/test-premium-simulados-access.js
          node scripts/test-premium-content-access.js
          node scripts/auditar-bloqueio-escalas.js

      - name: 🔐 Persistir shells Premium no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- '*.html'; then
            echo "Nenhuma página Premium precisou ser shellificada."
            exit 0
          fi
          git add -- '*.html'
          git commit -m "chore(access): proteger páginas Premium públicas"
          git push origin HEAD:main

      - name: ⚙️ Gerar Service Worker
        run: node gerar-sw.js

      - name: �📤 Upload dos arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./
          retention-days: 1

      - name: 🚀 Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}