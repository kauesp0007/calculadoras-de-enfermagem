name: 🚀 Deploy analytics-metrics no Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Publicar Edge Function analytics-metrics
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Adicione o secret SUPABASE_ACCESS_TOKEN no GitHub."; exit 1; }
          supabase functions deploy analytics-metrics --project-ref asjkftjfbkuuhilnqonx --no-verify-jwt

      - name: 🧪 Testar endpoint GA4
        run: |
          response="$(curl -sS --fail-with-body "https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1/analytics-metrics?range=last_30_days")"
          echo "$response" | grep -q '"version":2' || {
            echo "::error::A Edge Function não retornou o payload esperado."
            echo "$response"
            exit 1
          }
          echo "analytics-metrics respondeu com sucesso."
