<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Página não encontrada</title>
<script>
(function(){
  "use strict";
  var path=window.location.pathname||"";
  var match=path.match(/^\/(en|es|fr|it|de|hi|zh|ja|ru|ko|tr|nl|pl|sv|id|vi|uk|ar)\/(perfil|configuracoes|favoritos|historico)\.html$/i);
  if(!match) return;
  var target="/"+match[1].toLowerCase()+"/conta/"+match[2].toLowerCase()+".html"+window.location.search+window.location.hash;
  window.location.replace(target);
})();
</script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#173b71;display:grid;min-height:100vh;place-items:center}
main{max-width:680px;padding:32px;text-align:center}
a{color:#1a3e74;font-weight:700}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>A página solicitada não foi encontrada.</p>
<p><a href="/">Voltar ao início</a></p>
</main>
</body>
</html>
