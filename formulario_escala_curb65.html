<style>
:root{
--navy:#1E407C;
--navy-2:#1E5A91;
--navy-3:#1A4C7A;
--navy-deep:#1E3A8A;
--ink:#1E293B;
--slate-700:#334155;
--slate-600:#475569;
--slate-500:#64748B;
--slate-400:#7C8DA3;
--slate-300:#CBD5E1;
--slate-200:#E2E8F0;
--slate-100:#F1F5F9;
--slate-50:#F8FAFC;
--bg:#F4F7FA;
--line:#E2E8F0;
--blue:#2563EB;
--sky:#0EA5E9;
--radius:16px;
--radius-sm:12px;
--shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
--shadow-md:0 4px 16px rgba(15,23,42,.06), 0 2px 6px rgba(15,23,42,.04);
--shadow-lg:0 18px 40px -12px rgba(15,23,42,.14), 0 6px 16px -6px rgba(15,23,42,.06);
--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}

.skip-link{position:absolute;top:-100px;left:16px;z-index:10000;background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none}
.skip-link:focus{top:16px;position:fixed}

.main-content{flex-grow:1;padding:16px}
@media(min-width:640px){.main-content{padding:32px}}
.section{padding:24px 0}

/* CRUMBS */
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--slate-500);padding:16px 0 4px;flex-wrap:wrap}
.crumbs a{color:var(--navy);font-weight:600}
.crumbs .sep{color:var(--slate-300)}
.crumbs .current{color:var(--ink);font-weight:600}

/* HERO */
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,#1E407C 0%,#1E5A91 55%,#1A4C7A 100%);color:#fff;padding:34px 34px;box-shadow:var(--shadow-lg)}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#BFDBFE;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:999px}
.hero h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.08;margin:14px 0 8px;white-space:nowrap}
.hero h2{font-size:clamp(13px,1.9vw,16px);font-weight:500;color:#DBEAFE;max-width:680px;margin:0}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#E0EBFF;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:999px}

/* ACTION BAR */
.actionbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 4px}
.act{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--navy);background:#fff;border:1px solid var(--slate-200);padding:6px 11px;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:var(--shadow-sm);transition:all .18s;white-space:nowrap}
.act:hover{transform:translateY(-1px);border-color:var(--navy);background:var(--slate-50);text-decoration:none}
.act svg{width:12px;height:12px;color:var(--navy)}
.act.act-primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent}
.act.act-primary svg{color:#fff}
.act.act-primary:hover{background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff}

/* CARD */
.card{background:#fff;border:1px solid var(--slate-300);border-radius:var(--radius);box-shadow:0 4px 20px rgba(15,23,42,.14), 0 2px 8px rgba(15,23,42,.1)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:16px;font-weight:800;color:var(--navy-deep);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.card-head h3 .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--slate-100);color:var(--navy)}
.card-head h3 svg{width:17px;height:17px}
.card-body{padding:20px}

/* TEXTO CURTO */
.intro-card .card-body p{font-size:13.5px;color:var(--slate-600);line-height:1.6;margin:0 0 10px}
.intro-card .card-body ul{margin:0;padding-left:18px}
.intro-card .card-body li{font-size:13px;color:var(--slate-600);line-height:1.6;margin-bottom:5px}

/* PDF A4 */
.pdf-section{margin-top:18px}
.pdf-frame-wrap{width:100%;aspect-ratio:210/297;background:#fff;border:1px solid var(--slate-300);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md)}
.pdf-frame{display:block;width:100%;height:100%;border:0;background:#fff}
.pdf-caption{font-size:12px;color:var(--slate-500);margin:10px 0 0;display:flex;align-items:center;gap:7px}

/* BOTÃO DOWNLOADS (vidro azul) */
.downloads-zone{padding:22px 0 6px;text-align:left}
.btn-download-glass{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:800;color:#fff;padding:14px 26px;border-radius:16px;text-decoration:none;background:linear-gradient(135deg,rgba(30,64,124,.92),rgba(30,90,145,.88));border:1px solid rgba(147,197,253,.45);box-shadow:0 12px 30px -8px rgba(30,64,124,.55), inset 0 1px 0 rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .18s,box-shadow .18s}
.btn-download-glass:hover{transform:translateY(-2px);box-shadow:0 16px 38px -8px rgba(30,64,124,.65), inset 0 1px 0 rgba(255,255,255,.32);text-decoration:none}
.btn-download-glass:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.btn-download-glass svg{width:18px;height:18px;flex-shrink:0}
.btn-download-glass small{display:block;font-size:10.5px;font-weight:600;opacity:.85}

/* REFERÊNCIA / OBSERVAÇÃO */
.ref-note{font-size:12px;color:var(--slate-500);line-height:1.55}
.ref-note a{color:var(--blue);font-weight:600}

/* PROGRESS BAR global */
#progress-container{position:fixed;top:0;left:0;width:100%;height:4px;background:transparent;z-index:9999}
#progress-bar-global{height:100%;background:linear-gradient(90deg,#0EA5E9,#1E407C);width:0;transition:width .4s ease}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10001}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
.hero{padding:26px 20px;border-radius:20px}
.hero h1{white-space:normal}
}

@media print{
.no-print{display:none!important}
body{background:#fff}
.main-content{padding:0}
.pdf-section{margin:0}
.pdf-frame-wrap{aspect-ratio:auto;border:none;box-shadow:none;overflow:visible}
.pdf-frame{height:auto;min-height:100vh}
}
</style>
