<style>
:root{

.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--slate-400)}
.crumbs .current{color:var(--ink);font-weight:600}
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 60%,var(--navy-dark) 100%);color:#fff;padding:16px 28px 14px;box-shadow:var(--shadow-md);margin-bottom:12px}
.hero::before{content:"";position:absolute;width:220px;height:220px;right:-60px;top:-70px;border-radius:999px;background:#fff;opacity:.06;filter:blur(22px)}
.hero::after{content:"";position:absolute;width:170px;height:170px;left:-40px;bottom:-50px;border-radius:999px;background:var(--sky);opacity:.18;filter:blur(18px)}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#BFDBFE;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;margin-bottom:10px}
.hero h1{display:flex;align-items:center;gap:12px;font-family:'Nunito Sans',Inter,sans-serif;font-size:clamp(24px,3.6vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px}
.hero h1 i,.hero h1 svg{font-size:.8em;color:#9FD3FF}
.hero h2{font-size:clamp(13px,1.8vw,15px);font-weight:500;color:#DBEAFE;max-width:720px;margin:0}
.hero p.lead{font-size:13.5px;color:#E6F0FF;margin:10px 0 0;max-width:820px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#E0EBFF;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:6px 12px;border-radius:999px;text-decoration:none}
a.hero-chip:hover{background:rgba(255,255,255,.16);text-decoration:none}
.actionbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 4px;margin-bottom:12px}
.act{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--navy);background:#fff;border:1px solid var(--slate-200);padding:6px 11px;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:var(--shadow-sm);white-space:nowrap}
.act:hover{border-color:var(--navy);text-decoration:none}
.act.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.act svg{font-size:13px}

.hidden:not(#barraAcessibilidade){display:none!important}
.float-clock{position:fixed;top:150px;right:16px;z-index:99;display:flex;align-items:center;gap:3px;background:#fff;border:2px solid var(--navy);border-radius:10px;padding:5px 10px;box-shadow:0 4px 16px rgba(26,62,116,.25)}
.float-clock .clock-digit{font-family:'Courier New',monospace;font-size:1.1rem;font-weight:900;color:var(--navy);letter-spacing:1px;min-width:24px;text-align:center}
.float-clock .clock-label{font-size:7px;color:var(--slate-400);text-transform:uppercase;font-weight:700}
@media(max-width:768px){.float-clock{top:auto;bottom:12px;right:10px;border-radius:50px;padding:4px 10px}.float-clock .clock-digit{font-size:.9rem;min-width:18px}}

.dual-card{border-radius:12px;padding:14px 16px;box-shadow:0 4px 16px rgba(26,62,116,.08);border:1px solid #e2e8f0;background:#fff}

.q-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:1.25rem;box-shadow:0 8px 28px rgba(0,0,0,.15),0 4px 10px rgba(0,0,0,.08);transition:all .2s}
.q-card:hover{box-shadow:0 12px 32px rgba(26,62,116,.18)}
.q-opt{display:flex;align-items:center;padding:8px 10px;border:2px solid #d1d5db;border-radius:8px;margin-bottom:4px;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500}
.q-opt:hover{border-color:#4a90e2;background:#eff6ff}
.q-opt:focus-within{border-color:#4a90e2;background:#eff6ff;outline:2px solid #4a90e2;outline-offset:1px}
.q-opt .q-radio{appearance:none;width:18px;height:18px;border:2px solid #6b7280;border-radius:50%;margin-right:10px;flex-shrink:0;position:relative}
.q-opt .q-radio:checked{border-color:var(--navy);background:var(--navy);box-shadow:inset 0 0 0 4px #fff}
.q-opt.correct{border-color:#16a34a!important;background:#d1fae5!important;animation:blinkGreen .5s ease 3}
.q-opt.correct .q-radio{border-color:#16a34a;background:#16a34a}
.q-opt.wrong{border-color:#e11d48!important;background:#fee2e2!important}
.q-opt.wrong .q-radio{border-color:#e11d48;background:#e11d48}
@keyframes blinkGreen{0%,100%{background:#d1fae5!important}50%{background:#86efac!important}}
.q-meta{font-size:10px;font-weight:700;color:#1A3E74;text-transform:uppercase;letter-spacing:.03em}
.q-title{font-weight:700;color:#1f2937;margin-top:6px;font-size:15px;line-height:1.35}
.q-ref-label{margin-top:12px;padding-top:8px;border-top:1px solid #f3f4f6;font-size:10px;color:#94a3b8}

.btn-navy{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);color:#fff;border:none;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 4px 14px rgba(26,62,116,.3);transition:transform .15s,box-shadow .15s}
.btn-navy:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(26,62,116,.4)}
.btn-secondary{border:2px solid var(--slate-200);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;background:#fff;color:var(--slate-600);box-shadow:0 4px 10px rgba(0,0,0,.05);transition:all .15s}
.btn-secondary:hover{background:#f8fafc;border-color:#94a3b8}

.res-card{border-radius:14px;padding:16px 20px;box-shadow:0 8px 24px rgba(26,62,116,.1);border:1px solid #e2e8f0;background:#fff}
.res-stat{text-align:center}
.res-stat .num{font-size:2rem;font-weight:900}
.res-stat .lbl{font-size:10px;color:var(--slate-400);text-transform:uppercase;font-weight:700}
.memoria-table{width:100%;font-size:11px;border-collapse:collapse}
.memoria-table td{padding:5px 7px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.memoria-table .q-num{font-weight:900;color:var(--navy);white-space:nowrap}
.memoria-table .q-hit{color:#16a34a;font-weight:700}
.memoria-table .q-miss{color:#e11d48;font-weight:700}

.ref-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-top:12px}
.ref-card h3{font-size:12px;font-weight:900;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.ref-card ul{margin:0 0 0 16px;padding:0}
.ref-card li{font-size:11px;color:var(--slate-600);line-height:1.45;margin-bottom:3px}

.opt-txt{font-size:12px;font-weight:500;color:#374151}

.qbtn{font-size:12px;font-weight:700;border-radius:8px;border:2px solid #e2e8f0;color:#64748b;padding:8px 20px;cursor:pointer;background:#fff;transition:all .15s}
