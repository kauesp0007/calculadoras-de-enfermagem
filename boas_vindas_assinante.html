@media(max-width:700px){.timeline{padding-left:16px}.timeline-item:before{left:-24px}}
html[dir="rtl"] .timeline{border-left:0;border-right:3px solid #BFDBFE;padding-left:0;padding-right:20px}
html[dir="rtl"] .timeline-item:before{left:auto;right:-28px}
@media(max-width:700px){html[dir="rtl"] .timeline-item:before{right:-24px}}

<body class="bg-gray-50 text-gray-800 font-sans">

</div>
<div class="timeline-item">

</div>

<div id="footer-placeholder"></div>

<script>
(function(){
"use strict";
var API="https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1/billing-access";
var timer=null,started=Date.now();
function t(k){return window.AccountWelcomeI18n?window.AccountWelcomeI18n.get(k):k;}
function apply(){
var nodes=document.querySelectorAll("[data-welcome-key]");
Array.prototype.forEach.call(nodes,function(el){var key=el.getAttribute("data-welcome-key");el.textContent=t(key);});
var l=window.AccountWelcomeI18n&&window.AccountWelcomeI18n.code?window.AccountWelcomeI18n.code():"pt-BR";
document.documentElement.lang=l;
document.documentElement.dir=l==="ar"?"rtl":"ltr";
var home=window.AccountRouting&&window.AccountRouting.localizedHome?window.AccountRouting.localizedHome(l):(l==="pt-BR"?"/":"/"+l+"/");
var hb=document.getElementById("home-breadcrumb"),bt=document.getElementById("home-button"),sh=document.getElementById("skip-home");
if(hb){hb.textContent=t("home");hb.href=home;}
if(bt){bt.textContent=t("homeButton");bt.href=home;}
if(sh){sh.textContent=t("skipHome");sh.href=home;}
var sa=document.getElementById("skip-main"),aa=document.getElementById("skip-access");
if(sa)sa.textContent=t("skipMain");if(aa)aa.textContent=t("skipAccess");
var img=document.getElementById("welcome-image");if(img)img.alt=t("imageAlt");
var md=document.getElementById("meta-description");if(md)md.content=t("subtitle");
document.title="Premium | Calculadoras de Enfermagem";
}
function box(kind,title,text){
var b=document.getElementById("premium-confirmation"),bt=document.getElementById("premium-confirmation-title"),bx=document.getElementById("premium-confirmation-text");
if(!b||!bt||!bx)return;
b.className="notice mt-6 p-5"+(kind==="ok"?" ok":kind==="error"?" error":"");
bt.textContent=title;bx.textContent=text;
}
async function billing(){
try{
if(!window.Auth){box("error",t("unavailable"),t("unavailableText"));return;}
await (window.Auth.whenReady?window.Auth.whenReady():window.Auth.init());
var u=window.Auth.currentUser&&window.Auth.currentUser();
if(!u||typeof u.getIdToken!=="function"){box("error",t("loginRequired"),t("loginRequiredText"));return;}
var token=await u.getIdToken(false);
var res=await fetch(API,{method:"GET",headers:{Authorization:"Bearer "+token}});
if(!res.ok)throw new Error("billing_"+res.status);
var data=await res.json();
if(data&&data.plan==="premium"){box("ok",t("confirmed"),t("confirmedText"));if(timer)clearTimeout(timer);return;}
if(Date.now()-started<120000){box("pending",t("pending"),t("pendingText"));timer=setTimeout(billing,5000);return;}
box("error",t("pendingTimeout"),t("pendingTimeoutText"));
}catch(_){
if(Date.now()-started<120000){box("pending",t("pending"),t("pendingText"));timer=setTimeout(billing,7000);return;}
box("error",t("genericError"),t("genericErrorText"));
}}
function footer(){var el=document.getElementById("footer-placeholder");if(!el||el.dataset.loaded==="1")return;fetch("/footer.html",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("footer");return r.text();}).then(function(x){el.innerHTML=x;el.dataset.loaded="1";}).catch(function(){});}
document.addEventListener("DOMContentLoaded",function(){apply();billing();footer();});
document.addEventListener("conta:languagechange",function(){apply();});
})();
</script>
