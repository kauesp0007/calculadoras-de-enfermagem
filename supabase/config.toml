# Payment Edge Functions are reached either by external gateways or by
# clients carrying Firebase ID tokens. The functions validate their own
# credentials in application code, so Supabase must not try to validate the
# Firebase token as a Supabase JWT.

[functions.asaas-checkout]
verify_jwt = false

[functions.asaas-webhook]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.asaas-admin]
verify_jwt = false

[functions.forum-moderation]
verify_jwt = false

[functions.forum-author]
verify_jwt = false
