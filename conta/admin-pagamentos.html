<script>(function(){"use strict";function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");}var BASE="https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1";var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzamtmdGpmYmt1dWhpbG5xb254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwODMxNjQsImV4cCI6MjA4MjY1OTE2NH0.mly76L5r2zoasonwta8aNND2mWWrkAoXirAAs99mDYo";function fmt(v){if(!v)return"";var d=new Date(v);return isNaN(d.getTime())?v:d.toLocaleString(window.__LANG==="en"?"en-US":(window.__LANG||"pt-BR"),{dateStyle:"short",timeStyle:"short"});}async function load(){var u=window.Auth&&window.Auth.currentUser?window.Auth.currentUser():null;if(!u)throw new Error("Não autenticado");var token=await u.getIdToken();var r=await fetch(BASE+"/asaas-admin",{method:"POST",headers:{Authorization:"Bearer "+token,apikey:ANON,"Content-Type":"application/json"},body:"{}"});var d=await r.json().catch(function(){return{};});if(!r.ok)throw new Error(d.error||"Erro "+r.status);return d;}function render(list){var c=document.getElementById("admin-container");if(!list.length){c.innerHTML='<div class="rounded-2xl border border-gray-200 bg-white p-6 text-center text-slate-500">Nenhum assinante registrado ainda.</div>';return;}c.innerHTML='<h2 class="text-xl font-bold text-[#1A3E74] mb-3">Assinantes ('+list.length+')</h2>'+list.map(function(s,i){return '<div class="rounded-2xl border border-gray-200 bg-white p-4 mb-3"><div class="flex items-start justify-between gap-3"><div><p class="font-semibold">'+(i+1)+'. '+esc(s.name||"Assinante")+'</p><p class="text-sm text-slate-500">'+esc(s.email||"sem email")+'</p></div><span class="text-sm text-slate-500 whitespace-nowrap">'+esc(fmt(s.createdAt))+'</span></div><p class="text-xs text-green-600 font-semibold mt-1">Plano '+esc(s.planId||"junior")+' · ativo</p></div>';}).join("");}async function init(){try{await window.Auth.init();if(!window.Auth.isLoggedIn()){window.location.href="/conta/login.html";return;}var d=await load();render(d.subscribers||[]);}catch(e){document.getElementById("admin-container").innerHTML='<div class="rounded-2xl border border-red-300 bg-red-50 p-6 text-red-700">Acesso negado ou erro: '+esc(e.message)+'</div>';}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();})();</script></body></html>
