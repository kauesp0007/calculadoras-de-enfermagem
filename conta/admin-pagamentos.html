<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Painel de Pagamentos Pix - Calculadoras de Enfermagem</title>
<meta content="noindex, nofollow" name="robots"/>
<style id="critical-fonts">@font-face{font-family:"Inter";src:url("/fonts/inter/inter-regular.woff2") format("woff2");font-weight:400;font-display:swap;size-adjust:98%}@font-face{font-family:"Inter";src:url("/fonts/inter/inter-600.woff2") format("woff2");font-weight:600;font-display:swap;size-adjust:98%}@font-face{font-family:"Inter";src:url("/fonts/inter/inter-700.woff2") format("woff2");font-weight:700;font-display:swap;size-adjust:98%}@font-face{font-family:'Inter';src:url('/fonts/inter/inter-900.woff2') format('woff2');font-weight:900;font-display:swap;size-adjust:98%;}</style>
<link href="/public/output.css" rel="stylesheet">
<link href="/global-styles.css" rel="stylesheet">
<link rel="preload" href="/img/icontopbar1-calculadoras-de-enfermagem.webp" as="image" type="image/webp" fetchpriority="high">
<style id="anti-cls-placeholders">#global-header-container{display:block;width:100%;min-height:96px;background-color:transparent}@media(max-width:768px){#global-header-container{min-height:60px}}#language-selector-placeholder{display:block;width:100%;min-height:46px;background-color:transparent}#footer-placeholder{display:block;min-height:520px;background-color:transparent}@media(min-width:768px){#footer-placeholder{min-height:277px}}</style>
<script src="/global-scripts.js" defer></script>
<script src="/lang-selector.js" defer></script>
<script src="/js/conta-i18n.js" defer></script>
<script src="/js/firebase/firebase-init.js"></script>
<script src="/js/auth/auth-core.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<div id="global-header-container"></div>
<div id="language-selector-placeholder"></div>
<main class="flex-grow p-4 sm:p-8">
<section class="mb-6 w-full overflow-hidden rounded-2xl relative shadow-lg bg-gradient-to-br from-[#1A3E74] via-[#1E4D8C] to-[#163269]">
<div class="absolute inset-0 bg-white opacity-5"></div>
<div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6 px-4 sm:px-8 py-6 md:py-8">
<div class="w-full text-left">
<p class="text-blue-300 text-xs font-bold uppercase tracking-[0.15em] mb-2">ADMIN</p>
<h1 class="font-black text-[clamp(28px,5vw,44px)] leading-tight mb-3 text-white font-sans">Painel de Pagamentos Pix</h1>
<h2 class="text-blue-100 text-base font-medium font-sans">Aprove os pagamentos e libere o acesso premium (sem anúncios).</h2>
</div>
</div>
</section>
<div id="admin-container" class="w-full">
<p class="text-center text-slate-500">Carregando pedidos...</p>
</div>
</main>
<div id="footer-placeholder"></div>
<script>
document.addEventListener("DOMContentLoaded",()=>{setTimeout(()=>{fetch("/footer.html").then(r=>r.text()).then(d=>{document.getElementById("footer-placeholder").innerHTML=d;if(typeof carregarTraducoes==="function"){carregarTraducoes("pt","footer.json");carregarTraducoes("pt","cookies.json")}}).catch(()=>{})},150)});
</script>
<script>
(function(){
  "use strict";
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  var SUPABASE_FN_BASE = "https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzamtmdGpmYmt1dWhpbG5xb254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwODMxNjQsImV4cCI6MjA4MjY1OTE2NH0.mly76L5r2zoasonwta8aNND2mWWrkAoXirAAs99mDYo";

  function callAdmin(action, extra){
    var u = window.Auth && window.Auth.currentUser ? window.Auth.currentUser() : null;
    if(!u){ return Promise.reject(new Error("Não autenticado")); }
    var body = Object.assign({ adminUid: u.uid, action: action }, extra || {});
    return fetch(SUPABASE_FN_BASE + "/pix-admin", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "apikey": SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().then(function(d){
        if(!r.ok){ throw new Error(d && d.error ? d.error : "Erro " + r.status); }
        return d;
      });
    });
  }

  function renderOrders(orders){
    var c = document.getElementById("admin-container");
    if(!orders.length){
      c.innerHTML = '<div class="rounded-2xl border border-gray-200 bg-white p-6 text-center text-slate-500">Nenhum pedido de pagamento ainda.</div>';
      return;
    }
    var pending = orders.filter(function(o){ return o.status === "pending"; });
    var approved = orders.filter(function(o){ return o.status === "approved"; });
    var rejected = orders.filter(function(o){ return o.status === "rejected"; });
    var html = '';

    html += '<h2 class="text-xl font-bold text-[#1A3E74] mb-3">Pendentes (' + pending.length + ')</h2>';
    if(!pending.length){
      html += '<div class="rounded-2xl border border-gray-200 bg-white p-4 text-slate-500 mb-6">Nenhum pedido pendente.</div>';
    } else {
      html += '<div class="space-y-3 mb-8">';
      pending.forEach(function(o){
        html += '<div class="rounded-2xl border-2 border-amber-300 bg-amber-50 p-4">';
        html += '<p class="font-semibold">' + esc(o.name || "Usuário") + ' <span class="text-slate-500 font-normal">(' + esc(o.email || "sem email") + ')</span></p>';
        html += '<p class="text-sm text-slate-600">R$ ' + esc(o.amount || "10.00") + ' · Plano ' + esc(o.planId || "junior") + ' · <span class="text-slate-500">' + esc(o.createdAt || "") + '</span></p>';
        html += '<div class="mt-3 flex flex-wrap gap-2">';
        html += '<button type="button" class="approve-btn px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white font-semibold" data-uid="' + esc(o.uid) + '" data-order="' + esc(o.id) + '">Aprovar e liberar acesso</button>';
        html += '<button type="button" class="reject-btn px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold" data-order="' + esc(o.id) + '">Negar (não pago)</button>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<h2 class="text-xl font-bold text-[#1A3E74] mb-3">Já aprovados (' + approved.length + ')</h2>';
    if(!approved.length){
      html += '<div class="rounded-2xl border border-gray-200 bg-white p-4 text-slate-500 mb-6">Nenhum pedido aprovado.</div>';
    } else {
      html += '<div class="space-y-3 mb-8">';
      approved.forEach(function(o){
        html += '<div class="rounded-2xl border border-green-200 bg-green-50 p-4 opacity-90">';
        html += '<p class="font-semibold">' + esc(o.name || "Usuário") + ' <span class="text-slate-500 font-normal">(' + esc(o.email || "sem email") + ')</span></p>';
        html += '<p class="text-sm text-slate-500">Aprovado · ' + esc(o.createdAt || "") + '</p>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<h2 class="text-xl font-bold text-[#1A3E74] mb-3">Negados (' + rejected.length + ')</h2>';
    if(!rejected.length){
      html += '<div class="rounded-2xl border border-gray-200 bg-white p-4 text-slate-500">Nenhum pedido negado.</div>';
    } else {
      html += '<div class="space-y-3">';
      rejected.forEach(function(o){
        html += '<div class="rounded-2xl border border-gray-200 bg-white p-4 opacity-70">';
        html += '<p class="font-semibold">' + esc(o.name || "Usuário") + ' <span class="text-slate-500 font-normal">(' + esc(o.email || "sem email") + ')</span></p>';
        html += '<p class="text-sm text-slate-500">Negado · ' + esc(o.createdAt || "") + '</p>';
        html += '</div>';
      });
      html += '</div>';
    }

    c.innerHTML = html;
    c.querySelectorAll(".approve-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var uid = btn.getAttribute("data-uid");
        var orderId = btn.getAttribute("data-order");
        if(confirm("Liberar acesso premium (sem anúncios) por 1 mês para este usuário?")){
          btn.disabled = true; btn.textContent = "Liberando...";
          callAdmin("release", { uid: uid, orderId: orderId }).then(function(){
            loadOrders();
          }).catch(function(e){
            alert(e.message);
            btn.disabled = false; btn.textContent = "Aprovar e liberar acesso";
          });
        }
      });
    });
    c.querySelectorAll(".reject-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var orderId = btn.getAttribute("data-order");
        if(confirm("Marcar este pedido como NÃO PAGO (negar)?")){
          btn.disabled = true; btn.textContent = "Negando...";
          callAdmin("reject", { orderId: orderId }).then(function(){
            loadOrders();
          }).catch(function(e){
            alert(e.message);
            btn.disabled = false; btn.textContent = "Negar (não pago)";
          });
        }
      });
    });
  }

  function loadOrders(){
    callAdmin("list").then(function(d){
      renderOrders(d.orders || []);
    }).catch(function(e){
      document.getElementById("admin-container").innerHTML = '<div class="rounded-2xl border border-red-300 bg-red-50 p-6 text-red-700">Acesso negado ou erro: ' + esc(e.message) + '</div>';
    });
  }

  function init(){
    window.Auth.init().then(function(){
      if(!window.Auth.isLoggedIn()){ window.location.href="/conta/login.html"; return; }
      loadOrders();
    }).catch(function(){ window.location.href="/conta/login.html"; });
  }

  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); } else { init(); }
})();
</script>
</body>
</html>
