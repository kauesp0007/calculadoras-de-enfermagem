<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração de Billing — Calculadoras de Enfermagem</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/public/output.css"><link rel="stylesheet" href="/global-styles.css"><script src="/js/firebase/firebase-init.js"></script><script src="/js/auth/auth-session.js"></script><script src="/js/auth/auth-permissions.js"></script><script src="/js/auth/firestore-user.js"></script><script src="/js/auth/user-cache.js"></script><script src="/js/auth/user-events.js"></script><script src="/js/auth/preferences.js"></script><script src="/js/auth/auth-user-profile.js"></script><script src="/js/auth/auth-core.js"></script><script src="/global-scripts.js" defer></script></head><body class="bg-gray-50 text-gray-800 font-sans"><main class="p-4 sm:p-8"><section class="mb-6 w-full rounded-2xl shadow-lg bg-gradient-to-br from-[#1A3E74] via-[#1E4D8C] to-[#163269] px-4 sm:px-8 py-6 text-left"><p class="text-blue-200 text-xs font-bold uppercase tracking-[0.15em]">ADMIN</p><h1 class="font-black text-[clamp(28px,5vw,44px)] leading-tight text-white">Billing Premium</h1><h2 class="text-blue-100 text-base font-medium mt-2">Registro operacional de assinaturas e estados de cobrança.</h2></section><div id="admin-container" class="w-full"><p class="text-center text-slate-500">Carregando...</p></div></main><script>
(function(){ "use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
function fmt(v){if(!v)return"—";var d=new Date(v);return isNaN(d.getTime())?esc(v):esc(d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}));}
async function load(){var u=window.Auth&&window.Auth.currentUser?window.Auth.currentUser():null;if(!u)throw new Error("Não autenticado");var token=await u.getIdToken(false);var r=await fetch("https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1/billing-admin",{headers:{Authorization:"Bearer "+token,Accept:"application/json"}});var d=await r.json().catch(function(){return{};});if(!r.ok)throw new Error(d.error||"Erro "+r.status);return d;}
function render(rows){var c=document.getElementById("admin-container");if(!rows.length){c.innerHTML='<div class="rounded-2xl border bg-white p-6 text-center text-slate-500">Nenhuma assinatura registrada no novo ledger.</div>';return;}c.innerHTML=rows.map(function(s){return'<article class="rounded-2xl border bg-white p-5 mb-3"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="font-bold text-[#1A3E74]">'+esc(s.email||"Sem e-mail")+'</p><p class="text-xs text-slate-500 mt-1">'+esc(s.provider)+" · "+esc(s.status)+" · "+esc(s.currency||"—")+'</p></div><p class="text-sm font-semibold">Premium</p></div><dl class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4 text-sm"><div><dt class="text-xs text-slate-400">Início</dt><dd>'+fmt(s.current_period_start)+'</dd></div><div><dt class="text-xs text-slate-400">Fim</dt><dd>'+fmt(s.current_period_end)+'</dd></div><div><dt class="text-xs text-slate-400">Criado</dt><dd>'+fmt(s.created_at)+'</dd></div></dl></article>';}).join("");}
async function init(){try{await window.Auth.init();if(!window.Auth.isLoggedIn()){location.href="/conta/login.html";return;}render((await load()).subscriptions||[]);}catch(e){document.getElementById("admin-container").innerHTML='<div class="rounded-2xl border border-red-300 bg-red-50 p-6 text-red-700">Acesso negado ou erro: '+esc(e.message)+'</div>';}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();</script></body></html>
