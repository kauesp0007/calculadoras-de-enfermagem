<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1A3E74">
  <title>Conectar extensão — Calculadoras de Enfermagem</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:#f1f5f9;color:#1e293b;font-family:Inter,Arial,sans-serif}
    main{width:min(460px,100%);padding:28px;border:1px solid #dbeafe;border-radius:16px;background:#fff;box-shadow:0 18px 45px rgba(15,23,42,.14);text-align:center}
    .mark{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:#1A3E74;color:#fff;font-weight:900;font-size:20px}
    h1{margin:0 0 8px;color:#1A3E74;font-size:22px}p{margin:0;color:#64748b;font-size:14px;line-height:1.55}
    #bridge-error{margin-top:14px;padding:10px;border:1px solid #fecaca;border-radius:10px;background:#fef2f2;color:#991b1b;font-weight:700}
  </style>
  <script src="/js/firebase/firebase-init.js" defer></script>
  <script src="/js/auth/auth-core.js" defer></script>
  <script src="/js/auth/extension-login-bridge.js" defer></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CE</div>
    <h1>Conectando sua assinatura</h1>
    <p id="bridge-status" role="status">Verificando sua conta com segurança…</p>
    <p id="bridge-error" role="alert" hidden></p>
  </main>
</body>
</html>
