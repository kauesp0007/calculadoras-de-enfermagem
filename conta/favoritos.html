<script>
(function(){
"use strict";
var DATA="https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1/account-data",items=[],user;
function $(id){return document.getElementById(id);}
function race(p,m){var timer;return Promise.race([p,new Promise(function(_,r){timer=setTimeout(function(){r(new Error("timeout"));},m);})]).finally(function(){clearTimeout(timer);});}
async function session(){if(!window.Auth||!window.Auth.init)throw new Error("auth_unavailable");await race(window.Auth.init(),10000);return window.Auth.currentUser?window.Auth.currentUser():null;}
async function api(method,body){var token=await race(user.getIdToken(false),6000),r=await fetch(DATA+"?resource=favorites",{method:method,headers:{Authorization:"Bearer "+token,Accept:"application/json","Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"}),d=await r.json().catch(function(){return{};});if(!r.ok)throw new Error(d.error||"request_"+r.status);return d;}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}
function fmtDate(v){return window.AccountRuntimeI18n.date(v,{day:"2-digit",month:"2-digit",year:"numeric"});}
function fmtTime(v){return window.AccountRuntimeI18n.time(v);}
function niceDate(v){return window.AccountRuntimeI18n.relative(v);}
function icon(){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 4 2.2 4.8 5.1.6-3.8 3.6 1.1 5.1-4.6-2.6-4.6 2.6 1.1-5.1L4.6 9.4l5.2-.6L12 4Z"/></svg>';}
function fillFilters(){["category","favoriteType"].forEach(function(k){var id=k==="category"?"fav-filter-category":"fav-filter-type",s=$(id),vals=[...new Set(items.map(function(x){return x[k]}).filter(Boolean))].sort(),old=s.value;s.innerHTML='<option value="">'+(k==="category"?window.AccountRuntimeI18n.t("allCategories"):window.AccountRuntimeI18n.t("allTypes"))+'</option>'+vals.map(function(v){return'<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join("");s.value=old;});}
function renderStats(){var cats=new Set(items.map(function(x){return x.category}).filter(Boolean)),types=new Set(items.map(function(x){return x.favoriteType}).filter(Boolean));$("stat-total").textContent=items.length;$("stat-categories").textContent=cats.size;$("stat-types").textContent=types.size;var recent=items.slice().sort(function(a,b){return new Date(b.updatedAt||b.createdAt||0)-new Date(a.updatedAt||a.createdAt||0)})[0];$("stat-recent").textContent=recent?niceDate(recent.updatedAt||recent.createdAt):"—";}
function render(){
 var q=($("fav-search").value||"").trim().toLowerCase(),cat=$("fav-filter-category").value,type=$("fav-filter-type").value,sort=$("fav-sort").value,a=items.filter(function(x){return(!q||((x.title||"")+" "+(x.description||"")+" "+(x.category||"")).toLowerCase().includes(q))&&(!cat||x.category===cat)&&(!type||x.favoriteType===type);});
 a.sort(function(x,y){var tx=new Date(x.updatedAt||x.createdAt||0)-new Date(y.updatedAt||y.createdAt||0);return sort==="alpha"?(x.title||"").localeCompare(y.title||""):sort==="oldest"?tx:-tx;});
 $("fav-list").innerHTML=a.length?a.map(function(f){var date=f.updatedAt||f.createdAt,meta=[f.category,f.favoriteType,f.language].filter(Boolean).map(function(v){return'<span class="meta-pill">'+esc(v)+'</span>';}).join(" ");return'<div class="favorite-row"><span class="account-icon bg-[#EEF4FB] text-[#1A3E74]">'+icon()+'</span><div class="min-w-0"><a href="'+esc(f.url||"#")+'" class="no-underline"><p class="text-sm font-black text-[#1A3E74] truncate">'+esc(f.title||window.AccountRuntimeI18n.t("contentAccessed"))+'</p><p class="text-xs text-slate-500 truncate mt-0.5">'+esc(f.description||window.AccountRuntimeI18n.t("savedContent"))+'</p></a><div class="flex flex-wrap items-center gap-1.5 mt-1.5">'+meta+'<span class="text-[10px] text-slate-400">'+window.AccountRuntimeI18n.t("savedOn")+" "+esc(niceDate(date))+(fmtTime(date)?" "+window.AccountRuntimeI18n.t("atTime")+" "+esc(fmtTime(date)):"")+'</span></div></div><div class="favorite-actions flex items-center gap-2"><a href="'+esc(f.url||"#")+'" class="action-btn bg-[#EEF4FB] text-[#1A3E74] no-underline" title="'+window.AccountRuntimeI18n.t("openItem")+'" aria-label="'+window.AccountRuntimeI18n.t("openItem")+'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5h11v11"/><path d="m19 5-9 9"/><path d="M16 13v6H5V8h6"/></svg></a><button type="button" class="action-btn bg-[#FFF4EA] text-[#C45A12]" data-remove="'+esc(f.pageId||f.id)+'" title="'+window.AccountRuntimeI18n.t("removeItem")+'" aria-label="'+window.AccountRuntimeI18n.t("removeItem")+'">×</button></div></div>';}).join(""):'<div class="account-empty"><p class="text-sm font-semibold text-slate-600">'+window.AccountRuntimeI18n.t("noFavorites")+'</p><p class="text-xs text-slate-500 mt-1">'+window.AccountRuntimeI18n.t("addFavorites")+'</p></div>';
}
document.querySelectorAll("[data-remove]").forEach(function(b){b.onclick=async function(){var id=b.dataset.remove;b.disabled=true;try{await api("DELETE",{pageId:id});items=items.filter(function(x){return(x.pageId||x.id)!==id;});fillFilters();renderStats();render();}catch(e){b.disabled=false;showMessage(window.AccountRuntimeI18n.t("favoriteRemoveError"),true);}}});
}
function showMessage(text,error){var b=$("fav-message");b.setAttribute("role",error?"alert":"status");b.setAttribute("aria-live",error?"assertive":"polite");b.textContent=text;b.style.display="block";b.className="mb-4 px-4 py-3 rounded-xl text-sm font-semibold "+(error?"bg-red-50 text-red-700 border border-red-200":"bg-green-50 text-green-700 border border-green-200");}
async function boot(){try{user=await session();if(!user){location.replace("/conta/login.html?returnUrl="+encodeURIComponent(location.pathname+location.search));return;}var d=await api("GET");items=d.items||[];fillFilters();renderStats();render();$("fav-loading").style.display="none";$("fav-content").style.display="block";["fav-search","fav-filter-category","fav-filter-type","fav-sort"].forEach(function(id){$(id).addEventListener("input",render);$(id).addEventListener("change",render);});}catch(e){console.error(e);$("fav-loading").textContent=window.AccountRuntimeI18n.t("favoritesLoadError");}}
function init(){boot();}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();
})();
</script><div id="footer-placeholder"></div>
<script>document.addEventListener("DOMContentLoaded",function(){setTimeout(function(){fetch("/footer.html",{cache:"no-store"}).then(function(r){return r.ok?r.text():Promise.reject(new Error("footer_http_"+r.status));}).then(function(html){var el=document.getElementById("footer-placeholder");if(el)el.innerHTML=html;}).catch(function(e){console.warn("[Conta] footer:",e);});},150);});</script>
