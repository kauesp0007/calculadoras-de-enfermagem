<body class="bg-gray-50 text-gray-800 font-sans">

<main class="flex-grow p-4 sm:p-8">
<section class="mb-6 w-full overflow-hidden rounded-2xl relative shadow-2xl bg-gradient-to-br from-[#1A3E74] via-[#1E4D8C] to-[#163269]">
<div class="absolute inset-0 bg-white opacity-5 backdrop-blur-md"></div>
<div class="relative z-10 px-4 sm:px-8 py-8 md:py-10">
<p class="text-blue-300 text-xs font-bold uppercase tracking-[0.15em] mb-2">MINHA CONTA</p>
<h1 class="font-black text-[clamp(28px,5vw,44px)] leading-tight mb-3 text-white">Favoritos</h1>
<h2 class="text-blue-100 text-base font-medium">Acesse rapidamente suas calculadoras, escalas e materiais favoritos.</h2>
</div>
</section>
<!-- Breadcrumb -->
<nav class="flex text-sm mb-6 no-print" aria-label="Breadcrumb" style="color:#64748b;">
<ol class="flex items-center gap-2">
<li><a href="/" style="color:#1A3E74;font-weight:600;" class="hover:underline">Início</a></li>
<li style="color:#94A3B8;">›</li>
<li><a href="/conta/perfil.html" style="color:#1A3E74;font-weight:600;" class="hover:underline">Minha Conta</a></li>
<li style="color:#94A3B8;">›</li>
<li style="color:#1E293B;font-weight:600;">Favoritos</li>
</ol>
</nav>

<!-- Mensagem de feedback -->
<div id="fav-message" style="display:none;" role="alert"></div>

<!-- Estado de carregamento -->
<div id="fav-loading" class="bg-white rounded-2xl shadow-xl border border-gray-200 p-12 text-center text-slate-500 font-medium">
Carregando seus favoritos…
</div>

<!-- Conteúdo -->
<div id="fav-content" style="display:none;">
<div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-6 md:p-8">

<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
<h3 class="font-black text-[#1A3E74] text-lg flex items-center gap-2">Meus Favoritos <span id="fav-count" class="fav-badge align-middle"></span></h3>
<div class="relative md:w-80">
<input type="search" id="fav-search" placeholder="Pesquisar favoritos…" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#1A3E74] outline-none text-sm font-medium text-gray-800" aria-label="Pesquisar favoritos"/>
</div>
</div>

<div class="flex flex-wrap gap-3 mb-6">
<select id="fav-filter-category" class="px-3 py-2 rounded-lg border-2 border-gray-200 text-sm font-medium text-gray-700 bg-white focus:border-[#1A3E74] outline-none" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select>
<select id="fav-filter-type" class="px-3 py-2 rounded-lg border-2 border-gray-200 text-sm font-medium text-gray-700 bg-white focus:border-[#1A3E74] outline-none" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option></select>
<select id="fav-filter-language" class="px-3 py-2 rounded-lg border-2 border-gray-200 text-sm font-medium text-gray-700 bg-white focus:border-[#1A3E74] outline-none" aria-label="Filtrar por idioma"><option value="">Todos os idiomas</option></select>
<select id="fav-sort" class="px-3 py-2 rounded-lg border-2 border-gray-200 text-sm font-medium text-gray-700 bg-white focus:border-[#1A3E74] outline-none" aria-label="Ordenar favoritos">
<option value="recent">Mais recentes</option>
<option value="oldest">Mais antigos</option>
<option value="alpha">Ordem alfabética</option>
</select>
</div>

<div id="fav-list"></div>

</div>
</div>
</main>
<script src="/js/firebase/firebase-init.js"></script>
<script src="/js/auth/auth-session.js"></script>
<script src="/js/auth/auth-providers.js"></script>
<script src="/js/auth/auth-permissions.js"></script>

<script src="/js/auth/auth-user-profile.js"></script>
<script src="/js/auth/auth-core.js"></script>
<script src="/js/favorites/favorites-utils.js"></script>
<script src="/js/favorites/favorites-service.js"></script>
<script src="/js/favorites/favorites-cache.js"></script>
<script src="/js/favorites/favorites-events.js"></script>
<script src="/js/favorites/favorites-sync.js"></script>
<script src="/js/favorites/favorites-ui.js"></script>
<script>
(function () {
  "use strict";

  var TYPE_LABELS = {
    calculator: "Calculadora", scale: "Escala", article: "Artigo",
    protocol: "Protocolo", download: "Download", course: "Curso",
    premium: "Premium", library: "Biblioteca", simulation: "Simulado",
    page: "Página"
  };

  var LANG_LABELS = {
    pt: "Português", en: "Inglês", es: "Espanhol", de: "Alemão",
    it: "Italiano", fr: "Francês", hi: "Hindi", zh: "Chinês", ar: "Árabe",
    ja: "Japonês", ru: "Russo", ko: "Coreano", tr: "Turco", nl: "Holandês",
    pl: "Polonês", sv: "Sueco", id: "Indonésio", vi: "Vietnamita", uk: "Ucraniano"
  };

  function redirectLogin() {
    window.location.href =
      "/conta/login.html?returnUrl=" + encodeURIComponent(window.location.pathname);
  }

  function showContent() {
    var loading = document.getElementById("fav-loading");
    var content = document.getElementById("fav-content");
    if (loading) loading.style.display = "none";
    if (content) content.style.display = "block";
  }

  function showMessage(msg, isError) {
    var el = document.getElementById("fav-message");
    if (!el) return;
    el.textContent = msg;
    el.style.display = "block";
    el.className =
      "mb-4 px-4 py-3 rounded-xl text-sm font-semibold " +
      (isError
        ? "bg-red-50 text-red-700 border border-red-200"
        : "bg-green-50 text-green-700 border border-green-200");
    setTimeout(function () { el.style.display = "none"; }, 6000);
  }

  function buildOptions(select, values, labelFn) {
    if (!select) return;
    var current = select.value;
    select.innerHTML = "";

    var all = document.createElement("option");
    all.value = "";
    all.textContent = labelFn ? labelFn("") : "Todos";
    select.appendChild(all);

    values.forEach(function (v) {
      var o = document.createElement("option");
      o.value = v;
      o.textContent = labelFn ? labelFn(v) : v;
      select.appendChild(o);
    });

    select.value = current || "";
  }

  function getVisibleItems() {
    var items = window.Favorites.getAll();
    var q = (document.getElementById("fav-search").value || "").trim().toLowerCase();
    var cat = document.getElementById("fav-filter-category").value;
    var type = document.getElementById("fav-filter-type").value;
    var lang = document.getElementById("fav-filter-language").value;
    var sort = document.getElementById("fav-sort").value;

    var filtered = items.filter(function (f) {
      if (q) {
        var hay = ((f.title || "") + " " + (f.description || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (cat && f.category !== cat) return false;
      if (type && f.favoriteType !== type) return false;
      if (lang && f.language !== lang) return false;
      return true;
    });

    filtered.sort(function (a, b) {
      if (sort === "alpha") {
        return (a.title || "").localeCompare(b.title || "");
      }
      var ta = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
      var tb = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
      return sort === "oldest" ? ta - tb : tb - ta;
    });

    return filtered;
  }

  function refreshFilters() {
    var items = window.Favorites.getAll();
    var cats = [], types = [], langs = [];
    items.forEach(function (f) {
      if (f.category && cats.indexOf(f.category) === -1) cats.push(f.category);
      if (f.favoriteType && types.indexOf(f.favoriteType) === -1) types.push(f.favoriteType);
      if (f.language && langs.indexOf(f.language) === -1) langs.push(f.language);
    });
    cats.sort(); types.sort(); langs.sort();

    buildOptions(document.getElementById("fav-filter-category"), cats, function (v) {
      return v || "Todas as categorias";
    });
    buildOptions(document.getElementById("fav-filter-type"), types, function (v) {
      return v ? (TYPE_LABELS[v] || v) : "Todos os tipos";
    });
    buildOptions(document.getElementById("fav-filter-language"), langs, function (v) {
      return v ? (LANG_LABELS[v] || v.toUpperCase()) : "Todos os idiomas";
    });
  }

  function render() {
    var countEl = document.getElementById("fav-count");
    if (countEl) countEl.textContent = String(window.Favorites.count());
    window.Favorites.renderList(document.getElementById("fav-list"), getVisibleItems(), render);
  }

  ["fav-search", "fav-filter-category", "fav-filter-type", "fav-filter-language", "fav-sort"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    }
  });

  window.Auth.init()
    .then(function () {
      if (!window.Auth.isLoggedIn()) {
        redirectLogin();
        return;
      }

      var uid = window.Auth.currentUser().uid;
      window.Favorites.init(uid)
        .then(function () {
          refreshFilters();
          render();
          showContent();
        })
        .catch(function (e) {
          showMessage(
            "Erro ao carregar favoritos: " + (e && e.message ? e.message : "tente novamente."),
            true
          );
          showContent();
        });

      window.Favorites.on("favorites-changed", function () {
        refreshFilters();
        render();
      });
    })
    .catch(function () {
      redirectLogin();
    });
})();
</script>
