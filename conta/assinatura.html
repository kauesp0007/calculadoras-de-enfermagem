</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<div id="global-header-container"></div>
<div id="language-selector-placeholder"></div>
<main class="flex-grow p-4 sm:p-8">
<section class="mb-6 w-full overflow-hidden rounded-2xl relative shadow-lg bg-gradient-to-br from-[#1A3E74] via-[#1E4D8C] to-[#163269]">
<div class="absolute inset-0 bg-white opacity-5"></div>
<div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6 px-4 sm:px-8 py-6 md:py-8">
<div class="w-full md:w-3/4 text-left">
<p class="text-blue-300 text-xs font-bold uppercase tracking-[0.15em] mb-2">PLANOS</p>
<h1 class="font-black text-[clamp(28px,5vw,44px)] leading-tight mb-3 text-white font-sans">Planos e Assinatura</h1>
<h2 class="text-blue-100 text-base font-medium font-sans">Assine o Premium (Júnior) por R$ 5,00/mês e navegue sem anúncios.</h2>
</div>
<div class="hidden md:flex w-full md:w-auto justify-center md:justify-end shrink-0">
<img src="/img/ilustracao_enfermeira.webp" alt="Ilustração de enfermeira" class="w-24 md:w-32 h-auto rounded-xl" width="1920" height="2230" loading="lazy" decoding="async"/>
</div>
</div>
</section>
<div id="subscription-container" class="w-full">
<p class="text-center text-slate-500">Carregando...</p>
</div>
</main>
<div id="footer-placeholder"></div>
<script>document.addEventListener("DOMContentLoaded",()=>{setTimeout(()=>{fetch("/footer.html").then(r=>r.text()).then(d=>{document.getElementById("footer-placeholder").innerHTML=d;var l=window.AccountI18n.getLanguage()==="pt-BR"?"pt":window.AccountI18n.getLanguage();if(typeof carregarTraducoes==="function"){carregarTraducoes(l,"footer.json");carregarTraducoes(l,"cookies.json")}}).catch(()=>{})},150)});</script>
<script>
(function(){
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  function plansHtml(){
    var out = '<h2 class="text-2xl font-black text-[#1A3E74] mb-6">Escolha seu plano</h2>';
    out += '<div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">';

    out += '<div class="flex flex-col rounded-2xl border-2 border-[#1A3E74] bg-white p-6 shadow-md h-full">';
    out += '<span class="text-xs font-bold uppercase tracking-wide text-green-600 mb-2">Premium</span>';
    out += '<h3 class="text-lg font-bold text-[#1A3E74]">Plano Júnior</h3>';
    out += '<div class="mt-3 mb-4"><span class="text-3xl font-black text-[#1A3E74]">R$ 5,00</span><span class="text-sm text-[#1A3E74]"> /mês</span></div>';
    out += '<ul class="mt-2 mb-4 text-sm text-slate-700 space-y-2 flex-1 list-none p-0">';
    out += '<li class="flex items-start gap-2"><span class="text-[#1A3E74] font-bold">✓</span><span>Navegação sem anúncios</span></li>';
    out += '<li class="flex items-start gap-2"><span class="text-[#1A3E74] font-bold">✓</span><span>Acesso ao conteúdo premium</span></li>';
    out += '<li class="flex items-start gap-2"><span class="text-[#1A3E74] font-bold">✓</span><span>Cancele quando quiser</span></li>';
    out += '</ul>';
    out += '<div id="paypal-button-container" class="mt-auto w-full"></div>';
    out += '</div>';

    out += '<div class="flex flex-col rounded-2xl border-2 border-dashed border-gray-300 bg-gray-50 p-6 shadow-sm h-full">';
    out += '<span class="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Em breve</span>';
    out += '<h3 class="text-lg font-bold text-gray-700">Pagamento via Pix</h3>';
    out += '<p class="mt-3 mb-4 text-sm text-slate-600 flex-1">Em breve você poderá assinar o Premium pagando com Pix, direto e sem taxa extra.</p>';
    out += '<span class="block mt-auto w-full text-center px-4 py-2.5 rounded-lg bg-gray-200 text-gray-500 font-semibold">Disponível em breve</span>';
    out += '</div>';

    out += '</div>';
    return out;
  }

  function statusHtml(){
    var s = window.Subscription.current();
    var plan = window.SubscriptionModules.planManager.getPlan(s.planId);
    var label = window.SubscriptionModules.utils.statusLabel(s.status);
    var out = '<div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm mb-6">';
    out += '<h2 class="text-2xl font-black text-[#1A3E74] mb-3">Sua assinatura</h2>';
    out += '<p class="text-slate-700"><strong>Plano:</strong> '+esc(plan?plan.label:s.planId)+'</p>';
    out += '<p class="text-slate-700"><strong>Status:</strong> '+esc(label)+'</p>';
    out += '<div class="mt-4 flex flex-wrap gap-2">';
    var st = s.status;
    if(st==="pending"||st==="trial"){ out += '<button type="button" id="js-activate" class="px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white font-semibold">Ativar (simular pagamento)</button>'; }
    if(st==="active"){ out += '<button type="button" id="js-pause" class="px-4 py-2 rounded-lg bg-gray-600 hover:bg-gray-700 text-white font-semibold">Pausar</button><button type="button" id="js-cancel" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold">Cancelar</button>'; }
    if(st==="paused"){ out += '<button type="button" id="js-resume" class="px-4 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white font-semibold">Retomar</button><button type="button" id="js-cancel" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold">Cancelar</button>'; }
    out += '</div></div>';
    return out;
  }

  function render(){
    var c = document.getElementById("subscription-container");
    var s = window.Subscription.current();
    var html = "";
    if(s && ["pending","trial","active","paused","gracePeriod","cancelRequested","blocked"].indexOf(s.status)!==-1){
      html += statusHtml();
    }
    html += plansHtml();
    c.innerHTML = html;
    bind();
    initPayPal();
  }

  function bind(){
    var act=document.getElementById("js-activate"); if(act) act.addEventListener("click",function(){ window.Subscription.activate().then(render).catch(function(e){alert(e.message);}); });
    var pause=document.getElementById("js-pause"); if(pause) pause.addEventListener("click",function(){ window.Subscription.pause().then(render).catch(function(e){alert(e.message);}); });
    var resume=document.getElementById("js-resume"); if(resume) resume.addEventListener("click",function(){ window.Subscription.resume().then(render).catch(function(e){alert(e.message);}); });
    var cancel=document.getElementById("js-cancel"); if(cancel) cancel.addEventListener("click",function(){ if(confirm("Cancelar assinatura?")){ window.Subscription.cancel().then(render).catch(function(e){alert(e.message);}); } });
  }

  var PAYPAL_CLIENT_ID = "AY_l7-9s-x6hrY9gJUKICmssR7bzjcMypsTDH_-2t1KAO_31VAEIXz1mvUq1s1Hk53BM5pNfZHi9ZEYx";
  var PAYPAL_PLAN_ID = "P-5HK236923V929921LNKNGXWI";

  function initPayPal(){
    var el = document.getElementById("paypal-button-container");
    if(!el){ return; }
    if(window.paypal && window.paypal.Buttons){
      renderPayPalButton();
      return;
    }
    var s = document.createElement("script");
    s.src = "https://www.sandbox.paypal.com/sdk/js?client-id=" + PAYPAL_CLIENT_ID + "&vault=true&intent=subscription";
    s.onload = renderPayPalButton;
    document.head.appendChild(s);
  }

  function renderPayPalButton(){
    var el = document.getElementById("paypal-button-container");
    if(!el || !window.paypal || !window.paypal.Buttons){ return; }
    window.paypal.Buttons({
      style: { shape: "rect", color: "blue", layout: "vertical", label: "subscribe" },
      createSubscription: function(data, actions){
        var planObj = { plan_id: PAYPAL_PLAN_ID };
        try {
          var u = window.Auth && window.Auth.currentUser ? window.Auth.currentUser() : null;
          if (u && u.uid) { planObj.custom_id = u.uid; }
        } catch (e) { /* ignora */ }
        return actions.subscription.create(planObj);
      },
      onApprove: function(data, actions){
        onPayPalApproved(data.subscriptionID);
      },
      onError: function(){
        alert("Erro ao processar o pagamento. Tente novamente.");
      }
    }).render("#paypal-button-container");
  }

  function onPayPalApproved(subscriptionId){
    localStorage.setItem("paypal_subscription_id", subscriptionId);
    alert("Pagamento aprovado! Seu plano Premium será ativado em instantes (sem anúncios).");
    setTimeout(function(){ location.reload(); }, 2500);
  }

  function init(){
    Auth.init().then(function(){
      if(!Auth.isLoggedIn()){ window.location.href=window.AccountI18n.buildLoginUrl(window.location.pathname+window.location.search); return; }
      return window.Subscription.load();
    }).then(render).catch(function(){ window.location.href=window.AccountI18n.buildLoginUrl(); });
  }

  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",init); } else { init(); }
})();
</script>
</body>
</html>
