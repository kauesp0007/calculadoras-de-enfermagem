language)||lang(),country=(profile&&profile.country)||"—",plan=profile?profile.plan:"verifying",provider=profile?profile.provider:(user&&user.providerData&&user.providerData[0]?user.providerData[0].providerId:"");var avatarEl=document.getElementById("profile-avatar");if(avatarEl)avatarEl.innerHTML=photoURL?'<img src="'+photoURL+'" alt="'+name.replace(/"/g,"&quot;")+'" class="w-16 h-16 rounded-full border-2 border-[#1A3E74] object-cover" referrerpolicy="no-referrer" decoding="async" loading="lazy">':'<div class="w-16 h-16 rounded-full bg-[#1A3E74] flex items-center justify-center text-white font-black text-2xl">'+name.charAt(0).toUpperCase()+"</div>";setText("profile-name",name);setText("profile-email",email);setText("profile-plan",planLabel(plan));setText("profile-language",language.toUpperCase());setText("profile-country",country);setText("profile-provider",providerLabel(provider));setText("profile-created",formatDate(profile&&profile.createdAt));setText("profile-lastlogin",formatDate(profile&&profile.lastLoginAt));var nameInput=document.getElementById("edit-name-input");if(nameInput&&!nameInput.dataset.touched)nameInput.value=name;if(loading)loading.style.display="none";content.style.display="block";applyCustomLabels();}function setText(id,value){var el=document.getElementById(id);if(el)el.textContent=value;}document.getElementById("btn-save-name").addEventListener("click",function(){var input=document.getElementById("edit-name-input"),name=input?input.value.trim():"";if(name.length<2){showMessage(t("invalidName","Enter a valid name (at least 2 characters)."),true);return;}var btn=document.getElementById("btn-save-name");btn.disabled=true;(async function(){var user=window.Auth.currentUser();if(!user){await window.Auth.init();user=window.Auth.currentUser();}if(!user)throw new Error("not_authenticated");await window.AuthModules.userProfile.updateProfile(user.uid,{displayName:name});return {user:user};})().then(function(result){var savedUser=result.user;if(input)inpu /*
 * Boot robusto da página de perfil:
 * 1. Firebase Auth identifica o usuário e a UI básica é liberada imediatamente.
 * 2. O carregamento de billing/perfil ocorre em segundo plano.
 * 3. Uma falha de Supabase não pode congelar a página inteira.
 */
async function bootProfile(){
  var loading=document.getElementById("profile-loading");
  try{
    await window.FirebaseInit.init();
    var auth=window.FirebaseInit.getAuthSync();
    if(!auth)throw new Error("firebase_auth_unavailable");

    var user=auth.currentUser;
    if(!user){
      user=await new Promise(function(resolve){
        var settled=false;
        var unsub=auth.onAuthStateChanged(function(u){
          if(settled)return;
          settled=true;
          try{if(unsub)unsub();}catch(_){}
          resolve(u||null);
        });
        setTimeout(function(){
          if(!settled){
            settled=true;
            try{if(unsub)unsub();}catch(_){}
            resolve(null);
          }
        },5000);
      });
    }

    if(!user){
      window.location.href=window.AccountI18n.buildLoginUrl(window.location.pathname+window.location.search);
      return;
    }

    // Firebase Auth é a fonte imediata de identidade. A UI nunca depende do
    // Supabase/billing para deixar a página utilizável.
    render({
      uid:user.uid,email:user.email||"",displayName:user.displayName||"",
      photoURL:user.photoURL||"",plan:"free",
      provider:user.providerData&&user.providerData[0]?user.providerData[0].providerId:""
    },user);

    // Registra listeners antes da hidratação para não perder atualizações.
    window.Auth.onProfileChange(function(p){render(p,window.Auth.currentUser()||user);});
    window.Auth.onAuthChange(function(u){
      if(!u)window.location.href=window.AccountI18n.buildLoginUrl(window.location.pathname+window.location.search);
    });

    // Hidratação totalmente desacoplada: uma falha/lentidão do billing ou
    // account-data não pode manter spinner nem bloquear os botões.
    var hydration=Promise.resolve().then(function(){return window.Auth.init();});
    await Promise.race([
      hydration,
      new Promise(function(resolve){setTimeout(resolve,9000);})
    ]);

    var current=window.Auth.currentUser()||user;
    var profile=window.Auth.profile();
    if(profile)render(profile,current);
    else render({
      uid:user.uid,email:user.email||"",displayName:user.displayName||"",
      photoURL:user.photoURL||"",plan:"free",
      provider:user.providerData&&user.providerData[0]?user.providerData[0].providerId:""
    },current);
  }catch(e){
    console.error("[Profile] Inicialização da conta:",e);
    // Sessão Firebase já confirmada: não transformar uma falha auxiliar
    // em tela congelada. Se a identidade ainda não foi confirmada, redireciona.
    var auth=window.FirebaseInit&&window.FirebaseInit.getAuthSync?window.FirebaseInit.getAuthSync():null;
    var user=auth&&auth.currentUser?auth.currentUser:null;
    if(user){
      render({
        uid:user.uid,email:user.email||"",displayName:user.displayName||"",
        photoURL:user.photoURL||"",plan:"free",
        provider:user.providerData&&user.providerData[0]?user.providerData[0].providerId:""
      },user);
      showMessage("Sua sessão está ativa, mas alguns dados da conta estão temporariamente indisponíveis. A página continua utilizável.",true);
    }else{
      window.location.href=window.AccountI18n.buildLoginUrl(window.location.pathname+window.location.search);
      return;
    }
  }finally{
    if(loading)loading.style.display="none";
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",bootProfile);else bootProfile();})();</script>
