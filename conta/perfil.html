<script>
(function(){

function $(id){return document.getElementById(id)} function timeout(p,ms){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error("timeout"))},ms)})])}

async function boot(){try{var u=await session();if(!u){location.replace("/conta/login.html?returnUrl="+encodeURIComponent(location.pathname+location.search));return}var base={uid:u.uid,email:u.email||"",displayName:u.displayName||"",provider:u.providerData&&u.providerData[0]?u.providerData[0].providerId:"",language:"pt",country:"BR",plan:"verifying"};show(base);Promise.allSettled([req(DATA+"?resource=profile",u),req(BILL,u)]).then(function(a){var p=a[0].status==="fulfilled"?(a[0].value.profile||{}):{},b=a[1].status==="fulfilled"?a[1].value:{};show(Object.assign({},base,p,{plan:b.plan||"verifying",premium_expires_at:b.premium_expires_at||null}))});$("btn-save-name").onclick=async function(){var n=$("edit-name-input").value.trim();if(n.length<2){msg("Informe um nome válido.",true);return}var b=$("btn-save-name");b.disabled=true;try{var d=await req(DATA+"?resource=profile",u,"PATCH",{displayName:n});show(Object.assign({},base,d.profile||{}, {plan: $("profile-plan").textContent}));msg("Nome atualizado com sucesso.",false)}catch(e){msg("Não foi possível salvar. Tente novamente.",true)}finally{b.disabled=false}};$("btn-sair").onclick=async function(){try{var a=window.FirebaseInit.getAuthSync();if(a)await timeout(a.signOut(),6000)}finally{location.href="/"}}}catch(e){console.error(e);$("profile-loading").textContent="Não foi possível carregar sua conta. Tente novamente."}}

})();
