<body class="bg-gray-50 text-gray-800 font-sans">
<div id="global-header-container"></div>
<div id="language-selector-placeholder"></div>
<main class="flex-grow p-4 sm:p-8">
<section class="mb-6 w-full overflow-hidden rounded-2xl relative shadow-lg bg-gradient-to-br from-[#1A3E74] via-[#1E4D8C] to-[#163269]">
<div class="absolute inset-0 bg-white opacity-5"></div>
<div class="relative z-10 flex flex-col md:flex-row items-center justify-between px-4 sm:px-8 py-8 md:py-10">
<div class="w-full text-left">
<p class="text-blue-300 text-xs font-bold uppercase tracking-[0.15em] mb-2" data-conta-i18n="accountSystem">SISTEMA DE CONTAS</p>
<h1 class="font-black text-[clamp(28px,5vw,44px)] leading-tight mb-3 text-white font-sans" data-conta-i18n="profile">Meu Perfil</h1>
<h2 class="text-blue-100 text-base font-medium font-sans" data-conta-i18n="profileHero">Gerencie suas informações pessoais e preferências de conta.</h2>
</div>
</div>
</section>
<nav class="flex text-sm mb-6 no-print" aria-label="Breadcrumb"><ol class="flex items-center gap-2"><li><a href="/" style="color:#1A3E74;font-weight:600" class="hover:underline">Início</a></li><li aria-hidden="true" style="color:#94A3B8">›</li><li><a id="account-breadcrumb" href="/conta/login.html" style="color:#1A3E74;font-weight:600" class="hover:underline" data-conta-i18n="myAccount">Minha Conta</a></li><li aria-hidden="true" style="color:#94A3B8">›</li><li style="color:#1E293B;font-weight:600" data-conta-i18n="profile">Meu Perfil</li></ol></nav>
<div id="profile-message" style="display:none" role="alert"></div>
<div id="profile-loading" class="bg-white rounded-2xl shadow-xl border border-gray-200 p-12 text-center text-slate-500 font-medium">Preparando sua conta…</div>
<div id="profile-content" style="display:none">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
<div class="lg:col-span-8">
<div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-6 md:p-8">
<div class="flex items-center gap-4 mb-6 pb-6 border-b border-gray-100">
<div id="profile-avatar"></div>
<div class="min-w-0"><h3 id="profile-name" class="text-xl font-black text-[#1A3E74] truncate">—</h3><p id="profile-email" class="text-slate-600 truncate">—</p></div>
</div>
<dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4 text-sm">
<div><dt class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1" data-conta-i18n="plan">Plano</dt><dd id="profile-plan" class="font-semibold text-[#1A3E74]">—</dd></div>
<div><dt class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1" data-conta-i18n="siteLanguage">Idioma</dt><dd id="profile-language" class="font-semibold text-gray-700">—</dd></div>
<div><dt id="profile-country-label" class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">País</dt><dd id="profile-country" class="font-semibold text-gray-700">—</dd></div>
<div><dt id="profile-provider-label" class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Método de login</dt><dd id="profile-provider" class="font-semibold text-gray-700">—</dd></div>
<div><dt id="profile-created-label" class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Data de cadastro</dt><dd id="profile-created" class="font-semibold text-gray-700">—</dd></div>
<div><dt id="profile-lastlogin-label" class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Último acesso</dt><dd id="profile-lastlogin" class="font-semibold text-gray-700">—</dd></div>
</dl>
</div>
</div>
<div class="lg:col-span-4 space-y-6">
<div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-6">
<h4 class="font-black text-[#1A3E74] mb-4">Editar nome</h4>
<label for="edit-name-input" class="block text-xs font-bold uppercase tracking-wide text-slate-400 mb-1" data-conta-i18n="displayName">Nome de exibição</label>
<input type="text" id="edit-name-input" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#1A3E74] outline-none text-sm font-medium text-gray-800 mb-3" maxlength="100" autocomplete="name" placeholder="Seu nome completo">
<button type="button" id="btn-save-name" class="w-full px-4 py-3 rounded-xl bg-[#1A3E74] text-white font-bold hover:bg-[#1E4D8C] transition-colors" data-conta-i18n="saveName">Salvar nome</button>
</div>
<div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-6">
<h4 class="font-black text-[#1A3E74] mb-4" data-conta-i18n="myAccount">Minha Conta</h4>
<div class="space-y-3">
<a id="profile-settings-link" href="/conta/configuracoes.html" class="block w-full px-4 py-3 rounded-xl bg-gray-100 text-gray-800 font-bold text-center hover:bg-gray-200 transition-colors no-underline" data-conta-i18n="settings">Configurações</a>
<button type="button" id="btn-sair" class="w-full px-4 py-3 rounded-xl bg-red-50 text-red-600 font-bold hover:bg-red-100 transition-colors" data-conta-i18n="signOut">Sair da conta</button>
</div>
</div>
</div>
</div>
</div>
</main>
<div id="footer-placeholder"></div>
<script src="/js/firebase/firebase-init.js"></script>
<script src="/js/account/profile-page.js"></script>
</body>
</html>
