<h2 class="text-blue-100 text-base font-medium font-sans" data-conta-i18n="profileHero">Gerencie suas informações pessoais e preferências de conta.</h2>
</div>

<nav class="flex text-sm mb-6 no-print" aria-label="Breadcrumb"><ol class="flex items-center gap-2"><li><a href="/" style="color:#1A3E74;font-weight:600" class="hover:underline">Início</a></li><li aria-hidden="true" style="color:#94A3B8">›</li><li><a id="account-breadcrumb" href="/conta/login.html" style="color:#1A3E74;font-weight:600" class="hover:underline" data-conta-i18n="myAccount">Minha Conta</a></li><li aria-hidden="true" style="color:#94A3B8">›</li><li style="color:#1E293B;font-weight:600" data-conta-i18n="profile">Meu Perfil</li></ol></nav>

<div><dt id="profile-country-label" class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">País</dt><dd id="profile-country" class="font-semibold text-gray-700">—</dd></div>
<div><dt id="profile-provider-label" class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Método de login</dt><dd id="profile-provider" class="font-semibold text-gray-700">—</dd></div>

<div><dt id="profile-lastlogin-label" class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Último acesso</dt><dd id="profile-lastlogin" class="font-semibold text-gray-700">—</dd></div>
</dl>

<input type="text" id="edit-name-input" class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-[#1A3E74] outline-none text-sm font-medium text-gray-800 mb-3" maxlength="100" autocomplete="name" placeholder="Seu nome completo">
<button type="button" id="btn-save-name" class="w-full px-4 py-3 rounded-xl bg-[#1A3E74] text-white font-bold hover:bg-[#1E4D8C] transition-colors" data-conta-i18n="saveName">Salvar nome</button>
</div>

<div class="space-y-3">
<a id="profile-settings-link" href="/conta/configuracoes.html" class="block w-full px-4 py-3 rounded-xl bg-gray-100 text-gray-800 font-bold text-center hover:bg-gray-200 transition-colors no-underline" data-conta-i18n="settings">Configurações</a>
<button type="button" id="btn-sair" class="w-full px-4 py-3 rounded-xl bg-red-50 text-red-600 font-bold hover:bg-red-100 transition-colors" data-conta-i18n="signOut">Sair da conta</button>

<div id="footer-placeholder"></div>
<script src="/js/firebase/firebase-init.js" defer></script>
<script>
(function(){
"use strict";
var DATA="https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1/account-data";
var BILL="https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1/billing-access";
var user=null,billingState={plan:"verifying"};

function $(id){return document.getElementById(id);}
function showMessage(text,error){
  var box=$("profile-message"); if(!box)return;
  box.textContent=text; box.style.display="block";
  box.className="mb-4 px-4 py-3 rounded-xl text-sm font-semibold "+(error?"bg-red-50 text-red-700 border border-red-200":"bg-green-50 text-green-700 border border-green-200");
}
function safeDate(value){
  if(!value)return "—";
  var d=new Date(value);
  return isNaN(d.getTime())?"—":d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
}
function render(profile){
  profile=profile||{};
  var name=profile.displayName||profile.email||"Usuário";
  $("profile-name").textContent=name;
  $("profile-email").textContent=profile.email||"—";
  $("edit-name-input").value=profile.displayName||"";
  var avatar=$("profile-avatar");
  if(avatar){
    avatar.innerHTML="";
    if(profile.photoURL){
      var img=document.createElement("img");
      img.src=profile.photoURL; img.alt=""; img.className="w-16 h-16 rounded-full border-2 border-[#1A3E74] object-cover";
      img.referrerPolicy="no-referrer"; avatar.appendChild(img);
    }else{
      avatar.className="w-16 h-16 rounded-full bg-[#1A3E74] flex items-center justify-center text-white font-black text-2xl";
      avatar.textContent=name.trim().charAt(0).toUpperCase()||"U";
    }
  }
  var plan=billingState&&billingState.plan;
  $("profile-plan").textContent=plan==="premium"?"Premium":plan==="verifying"?"Verificando…":"Gratuito";
  $("profile-language").textContent=profile.language||"pt";
  $("profile-country").textContent=profile.country||"BR";
  $("profile-provider").textContent=profile.provider||"—";
  $("profile-created").textContent=safeDate(profile.createdAt);
  $("profile-lastlogin").textContent=safeDate(profile.lastLoginAt);
  $("profile-loading").style.display="none";
  $("profile-content").style.display="block";
}
function showStaticState(){
  render({displayName:"Visitante",email:"",language:"pt",country:"BR",provider:"—"});
  $("profile-plan").textContent="Sistema de contas pausado";
  $("profile-message").style.display="none";
}
async function withTimeout(promise,ms){
  var timer;
  return Promise.race([promise,new Promise(function(_,reject){timer=setTimeout(function(){reject(new Error("timeout"));},ms);})]).finally(function(){clearTimeout(timer);});
}
async function api(url,method,body){
  if(!user)throw new Error("not_authenticated");
  var token=await withTimeout(user.getIdToken(false),6000);
  var controller=new AbortController();
  var timer=setTimeout(function(){controller.abort();},7000);
  try{
    var response=await fetch(url,{method:method||"GET",headers:{Authorization:"Bearer "+token,Accept:"application/json","Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store",signal:controller.signal});
    var data=await response.json().catch(function(){return{};});
    if(!response.ok)throw new Error(data.error||("request_"+response.status));
    return data;
  }finally{clearTimeout(timer);}
}
async function loadChrome(){
  var header=$("global-header-container"),footer=$("footer-placeholder");
  var jobs=[];
  if(header&&!header.innerHTML.trim())jobs.push(withTimeout(fetch("/menu-global.html",{cache:"no-store"}),4000).then(function(r){if(r.ok)return r.text();}).then(function(html){if(html)header.innerHTML=html;}).catch(function(e){console.warn("[Perfil] menu:",e);}));
  if(footer&&!footer.innerHTML.trim())jobs.push(withTimeout(fetch("/footer.html",{cache:"no-store"}),4000).then(function(r){if(r.ok)return r.text();}).then(function(html){if(html)footer.innerHTML=html;}).catch(function(e){console.warn("[Perfil] footer:",e);}));
  await Promise.allSettled(jobs);
  try{if(window.initializeNavigationMenu)window.initializeNavigationMenu();}catch(e){}
}
async function loadAccount(){
  try{
    if(!window.FirebaseInit||!window.FirebaseInit.init)throw new Error("firebase_unavailable");
    await withTimeout(window.FirebaseInit.init(),8000);
    var auth=window.FirebaseInit.getAuthSync();
    if(!auth)throw new Error("auth_unavailable");
    user=auth.currentUser;
    if(!user){
      user=await withTimeout(new Promise(function(resolve){
        var done=false;
        var unsub=auth.onAuthStateChanged(function(next){if(done)return;done=true;try{unsub();}catch(_){}resolve(next||null);});
      }),7000);
    }
    if(!user){showStaticState();return;}
    var data=await api(DATA+"?resource=profile");
    if(data&&data.profile)render(data.profile);
    try{billingState=await api(BILL); if(data&&data.profile)render(data.profile);}catch(e){console.warn("[Perfil] billing:",e);}
  }catch(error){
    console.warn("[Perfil] conta indisponível:",error);
    showStaticState();
  }
}
async function saveName(){
  var input=$("edit-name-input"),button=$("btn-save-name");
  if(!user){showMessage("O sistema de login está pausado no momento. Esta ação ficará disponível quando as contas forem reativadas.",true);return;}
  var name=(input.value||"").trim();
  if(name.length<2){showMessage("Digite um nome válido (mínimo 2 caracteres).",true);input.focus();return;}
  button.disabled=true;button.setAttribute("aria-busy","true");
  try{
    var response=await api(DATA+"?resource=profile","PATCH",{displayName:name});
    if(!response||!response.profile)throw new Error("profile_update_empty");
    try{await withTimeout(user.updateProfile({displayName:name}),6000);}catch(_){}
    render(response.profile);showMessage("Nome atualizado com sucesso!",false);
  }catch(error){console.error("[Perfil] salvar:",error);showMessage("Não foi possível salvar o nome. Tente novamente.",true);}
  finally{button.disabled=false;button.removeAttribute("aria-busy");}
}
async function signOut(){
  if(!user){showMessage("O sistema de login está pausado no momento. Não há uma sessão ativa para encerrar.",true);return;}
  var button=$("btn-sair");button.disabled=true;button.setAttribute("aria-busy","true");
  try{var auth=window.FirebaseInit.getAuthSync();if(auth)await withTimeout(auth.signOut(),6000);window.location.replace("/");}
  catch(error){button.disabled=false;button.removeAttribute("aria-busy");showMessage("Não foi possível sair da conta. Tente novamente.",true);}
}
function boot(){
  showStaticState();
  $("btn-save-name").addEventListener("click",saveName);
  $("btn-sair").addEventListener("click",signOut);
  loadChrome().catch(function(e){console.warn("[Perfil] chrome:",e);});
  loadAccount();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
})();
</script>
</body>
</html>
