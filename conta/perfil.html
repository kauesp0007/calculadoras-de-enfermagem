<script>
(function () {
"use strict";
function t(key, fallback){ try { return window.AccountI18n.t(key); } catch (_) { return fallback || key; } }
function setText(id,value){var el=document.getElementById(id);if(el)el.textContent=value;}
function currentLang(){try{return window.AccountRoutes?window.AccountRoutes.currentLanguage():"pt";}catch(_){return "pt";}}
var COUNTRY={pt:"Brasil",en:"Country",es:"País",fr:"Pays",de:"Land",it:"Paese",hi:"देश",zh:"国家",ja:"国",ru:"Страна",ko:"국가",tr:"Ülke",nl:"Land",pl:"Kraj",sv:"Land",id:"Negara",vi:"Quốc gia",uk:"Країна",ar:"الدولة"};
var LOGIN_METHOD={pt:"Método de login",en:"Sign-in method",es:"Método de inicio de sesión",fr:"Méthode de connexion",de:"Anmeldemethode",it:"Metodo di accesso",hi:"लॉगिन विधि",zh:"登录方式",ja:"ログイン方法",ru:"Способ входа",ko:"로그인 방식",tr:"Giriş yöntemi",nl:"Aanmeldmethode",pl:"Metoda logowania",sv:"Inloggningsmetod",id:"Metode masuk",vi:"Phương thức đăng nhập",uk:"Спосіб входу",ar:"طريقة تسجيل الدخول"};
var CREATED={pt:"Data de cadastro",en:"Registration date",es:"Fecha de registro",fr:"Date d’inscription",de:"Registrierungsdatum",it:"Data di registrazione",hi:"पंजीकरण तिथि",zh:"注册日期",ja:"登録日",ru:"Дата регистрации",ko:"가입일",tr:"Kayıt tarihi",nl:"Registratiedatum",pl:"Data rejestracji",sv:"Registreringsdatum",id:"Tanggal pendaftaran",vi:"Ngày đăng ký",uk:"Дата реєстрації",ar:"تاريخ التسجيل"};
var LAST={pt:"Último acesso",en:"Last access",es:"Último acceso",fr:"Dernier accès",de:"Letzter Zugriff",it:"Ultimo accesso",hi:"अंतिम पहुंच",zh:"上次访问",ja:"最終アクセス",ru:"Последний вход",ko:"마지막 접속",tr:"Son erişim",nl:"Laatste toegang",pl:"Ostatni dostęp",sv:"Senaste åtkomst",id:"Akses terakhir",vi:"Lần truy cập cuối",uk:"Останній доступ",ar:"آخر وصول"};
var NAME_EDIT={pt:"Editar nome",en:"Edit name",es:"Editar nombre",fr:"Modifier le nom",de:"Namen bearbeiten",it:"Modifica nome",hi:"नाम संपादित करें",zh:"编辑姓名",ja:"名前を編集",ru:"Изменить имя",ko:"이름 편집",tr:"Adı düzenle",nl:"Naam bewerken",pl:"Edytuj nazwę",sv:"Redigera namn",id:"Edit nama",vi:"Chỉnh sửa tên",uk:"Змінити ім’я",ar:"تعديل الاسم"};
function applyCustomLabels(){var l=currentLang(),map=[['#profile-country','profile-country-label',COUNTRY[l]||COUNTRY.en],['#profile-provider','profile-provider-label',LOGIN_METHOD[l]||LOGIN_METHOD.en],['#profile-created','profile-created-label',CREATED[l]||CREATED.en],['#profile-lastlogin','profile-lastlogin-label',LAST[l]||LAST.en],['#edit-name-input','name-edit-label',NAME_EDIT[l]||NAME_EDIT.en]];map.forEach(function(x){var host=document.querySelector(x[0]);if(host){var dt=host.closest('div')?.querySelector('dt');if(x[0]==='#edit-name-input')dt=document.querySelector('label[for="edit-name-input"]');if(dt)dt.textContent=x[2];}});}
function formatDate(value){if(!value)return "—";var d=value instanceof Date?value:new Date(value);if(isNaN(d.getTime()))return "—";var l=currentLang();var locale=l==="pt"?"pt-BR":l;return d.toLocaleDateString(locale,{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString(locale,{hour:"2-digit",minute:"2-digit"});}
function providerLabel(provider){if(!provider)return "—";if(provider.indexOf("google")!==-1)return "Google";if(provider.indexOf("microsoft")!==-1)return "Microsoft";if(provider.indexOf("apple")!==-1)return "Apple";if(provider==="email"||provider.indexOf("password")!==-1)return "E-mail/Password";return provider;}
function planLabel(plan){if(!plan||plan==="free")return t("free","Free");if(plan==="junior")return t("junior","Premium (Junior)");return plan;}
function showMessage(msg,isError){var el=document.getElementById("profile-message");if(!el)return;el.textContent=msg;el.style.display="block";el.className="mb-4 px-4 py-3 rounded-xl text-sm font-semibold "+(isError?"bg-red-50 text-red-700 border border-red-200":"bg-green-50 text-green-700 border border-green-200");setTimeout(function(){el.style.display="none";},6000);}
function render(profile,user){var content=document.getElementById("profile-content"),loading=document.getElementById("profile-loading");if(!content)return;var name=(profile&&profile.displayName)||(user&&user.displayName)||t("fullName","User"),email=(profile&&profile.email)||(user&&user.email)||"",photoURL=(profile&&profile.photoURL)||(user&&user.photoURL)||"",language=(profile&&profile.language)||currentLang(),country=(profile&&profile.country)||"—",plan=profile?profile.plan:"free",provider=profile?profile.provider:(user&&user.providerData&&user.providerData[0]?user.providerData[0].providerId:"");var avatarEl=document.getElementById("profile-avatar");if(avatarEl)avatarEl.innerHTML=photoURL?'<img src="'+photoURL+'" alt="'+name.replace(/"/g,"&quot;")+'" class="w-16 h-16 rounded-full border-2 border-[#1A3E74] object-cover" referrerpolicy="no-referrer" decoding="async" loading="lazy">':'<div class="w-16 h-16 rounded-full bg-[#1A3E74] flex items-center justify-center text-white font-black text-2xl">'+name.charAt(0).toUpperCase()+"</div>";setText("profile-name",name);setText("profile-email",email);setText("profile-plan",planLabel(plan));setText("profile-language",language.toUpperCase());setText("profile-country",country);setText("profile-provider",providerLabel(provider));setText("profile-created",formatDate(profile&&profile.createdAt));setText("profile-lastlogin",formatDate(profile&&profile.lastLoginAt));var nameInput=document.getElementById("edit-name-input");if(nameInput&&!nameInput.dataset.touched)nameInput.value=name;if(loading)loading.style.display="none";content.style.display="block";applyCustomLabels();}

document.getElementById("btn-save-name").addEventListener("click",function(){var input=document.getElementById("edit-name-input"),name=input?input.value.trim():"";if(name.length<2){showMessage("Digite um nome válido (mínimo 2 caracteres).",true);return;}var user=window.Auth.currentUser();if(!user)return;var btn=document.getElementById("btn-save-name");btn.disabled=true;window.AuthModules.userProfile.updateProfile(user.uid,{displayName:name}).then(function(updated){if(user.updateProfile)user.updateProfile({displayName:name}).catch(function(){});if(input)input.dataset.touched="1";showMessage("Nome atualizado com sucesso!",false);render(updated||window.Auth.profile(),user);}).catch(function(e){showMessage(t("saveError","Error saving:")+" "+(e&&e.message?e.message:t("tryAgain","try again.")),true);}).finally(function(){btn.disabled=false;});});
document.getElementById("btn-sair").addEventListener("click",function(){window.Auth.signOut().then(function(){window.location.href=window.AccountI18n.localizedHome();});});
function bindRoutes(){var l=currentLang();var settings=document.getElementById("profile-settings-link"),crumb=document.getElementById("account-breadcrumb");if(settings)settings.href=window.AccountRoutes.accountUrl("configuracoes.html",l);if(crumb)crumb.href=window.AccountRoutes.accountUrl("login.html",l);}
bindRoutes();
window.Auth.init().then(function(){if(!window.Auth.isLoggedIn()){window.location.href=window.AccountI18n.buildLoginUrl(window.location.pathname+window.location.search);return;}var user=window.Auth.currentUser(),profile=window.Auth.profile();if(profile)render(profile,user);window.Auth.onProfileChange(function(p){render(p,window.Auth.currentUser());});}).catch(function(){window.location.href=window.AccountI18n.buildLoginUrl(window.location.pathname+window.location.search);});
window.addEventListener("popstate",bindRoutes);
})();
