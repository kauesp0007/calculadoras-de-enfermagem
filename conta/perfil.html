<script>
(function () {
"use strict";

function redirectLogin() {
window.location.href =
window.AccountI18n.buildLoginUrl(window.location.pathname + window.location.search);
}

function setText(id, value) {
var el = document.getElementById(id);
if (el) {
el.textContent = value;
}
}

function formatDate(value) {
if (!value) {
return "—";
}
var d = value instanceof Date ? value : new Date(value);
if (isNaN(d.getTime())) {
return "—";
}
return (
d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }) +
" " +
d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
);
}

function providerLabel(provider) {
if (!provider) {
return "—";
}
if (provider.indexOf("google") !== -1) return "Google";
if (provider.indexOf("microsoft") !== -1) return "Microsoft";
if (provider.indexOf("apple") !== -1) return "Apple";
if (provider === "email" || provider.indexOf("password") !== -1) return "E-mail/Senha";
return provider;
}

function planLabel(plan) {
if (!plan || plan === "free") return "Gratuito";
if (plan === "premium_monthly") return "Premium Mensal";
if (plan === "premium_annual") return "Premium Anual";
return plan;
}

function showMessage(msg, isError) {
var el = document.getElementById("profile-message");
if (!el) return;
el.textContent = msg;
el.style.display = "block";
el.className =
"mb-4 px-4 py-3 rounded-xl text-sm font-semibold " +
(isError
? "bg-red-50 text-red-700 border border-red-200"
: "bg-green-50 text-green-700 border border-green-200");
setTimeout(function () {
el.style.display = "none";
}, 6000);
}

function render(profile, user) {
var content = document.getElementById("profile-content");
var loading = document.getElementById("profile-loading");
if (!content) return;

var name = (profile && profile.displayName) || (user && user.displayName) || "Usuário";
var email = (profile && profile.email) || (user && user.email) || "";
var photoURL = (profile && profile.photoURL) || (user && user.photoURL) || "";
var language = (profile && profile.language) || "pt";
var country = (profile && profile.country) || "—";
var plan = profile ? profile.plan : "free";
var provider = profile
? profile.provider
: user && user.providerData && user.providerData[0]
? user.providerData[0].providerId
: "";

var avatarEl = document.getElementById("profile-avatar");
if (avatarEl) {
avatarEl.innerHTML = photoURL
? '<img src="' + photoURL + '" alt="' + name + '" class="w-16 h-16 rounded-full border-2 border-[#1A3E74] object-cover" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'"/>'
: '<div class="w-16 h-16 rounded-full bg-[#1A3E74] flex items-center justify-center text-white font-black text-2xl">' + name.charAt(0).toUpperCase() + "</div>";
}

setText("profile-name", name);
setText("profile-email", email);
setText("profile-plan", planLabel(plan));
setText("profile-language", language.toUpperCase());
setText("profile-country", country);
setText("profile-provider", providerLabel(provider));
setText("profile-created", formatDate(profile && profile.createdAt));
setText("profile-lastlogin", formatDate(profile && profile.lastLoginAt));

var nameInput = document.getElementById("edit-name-input");
if (nameInput && !nameInput.dataset.touched) {
nameInput.value = name;
}

if (loading) loading.style.display = "none";
content.style.display = "block";
}

document.getElementById("btn-save-name").addEventListener("click", function () {
var input = document.getElementById("edit-name-input");
var name = input ? input.value.trim() : "";
if (name.length < 2) {
showMessage("Digite um nome válido (mínimo 2 caracteres).", true);
return;
}

var user = window.Auth.currentUser();
if (!user) return;

var btn = document.getElementById("btn-save-name");
btn.disabled = true;

window.AuthModules.userProfile
.updateProfile(user.uid, { displayName: name })
.then(function (updated) {
if (user.updateProfile) {
user.updateProfile({ displayName: name }).catch(function () {});
}
input.dataset.touched = "1";
showMessage("Nome atualizado com sucesso!", false);
render(updated || window.Auth.profile(), user);
})
.catch(function (e) {
showMessage(
"Erro ao salvar: " + (e && e.message ? e.message : "tente novamente."),
true
);
})
.finally(function () {
btn.disabled = false;
});
});

document.getElementById("btn-sair").addEventListener("click", function () {
window.Auth.signOut().then(function () {
window.location.href = window.AccountI18n.localizedHome();
});
});

window.Auth.init()
.then(function () {
if (!window.Auth.isLoggedIn()) {
redirectLogin();
return;
}

var user = window.Auth.currentUser();
var profile = window.Auth.profile();
if (profile) {
render(profile, user);
}

window.Auth.onProfileChange(function (p) {
render(p, window.Auth.currentUser());
});
})
.catch(function () {
redirectLogin();
});
})();
</script>
