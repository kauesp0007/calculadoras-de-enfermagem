<script>
(function(){
"use strict";var DATA="https://asjkftjfbkuuhilnqonx.supabase.co/functions/v1/account-data";
function $(i){return document.getElementById(i)} function race(p,m){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error("timeout"))},m)})])}
async function session(){await race(window.FirebaseInit.init(),10000);var a=window.FirebaseInit.getAuthSync();if(a&&a.currentUser)return a.currentUser;return await race(new Promise(function(res){var u=a.onAuthStateChanged(function(x){u();res(x)})}),8000)}
async function req(url,method,body){url=url||DATA;var t=await race(window._accountUser.getIdToken(false),5000),r=await fetch(url+"?resource=profile",{method:method||"GET",headers:{Authorization:"Bearer "+t,Accept:"application/json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"}),d=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(d.error||"request_"+r.status);return d}
function msg(s,e){var x=$("settings-message");x.textContent=s;x.style.display="block";x.className="mb-4 px-4 py-3 rounded-xl text-sm font-semibold "+(e?"bg-red-50 text-red-700 border border-red-200":"bg-green-50 text-green-700 border border-green-200")}
function norm(p){p=p||{};return {language:p.language||"pt",theme:p.theme==="dark"?"dark":"light",newsletter:!!p.newsletter,fontSize:Math.min(Math.max(parseInt(p.fontSize,10)||1,1),5)}}
async function boot(){try{window._accountUser=await session();if(!window._accountUser){location.replace("/conta/login.html?returnUrl="+encodeURIComponent(location.pathname+location.search));return}var d=await req();var p=norm(d.profile&&d.profile.preferences);$("setting-language").value=p.language;$("setting-newsletter").checked=p.newsletter;$("setting-fontsize").value=String(p.fontSize);document.querySelectorAll("input[name='setting-theme']").forEach(function(x){x.checked=x.value===p.theme});$("settings-loading").style.display="none";$("settings-content").style.display="block";$("btn-save-settings").onclick=async function(){var q=norm({language:$("setting-language").value,theme:(document.querySelector("input[name='setting-theme']:checked")||{}).value,newsletter:$("setting-newsletter").checked,fontSize:$("setting-fontsize").value});var b=$("btn-save-settings");b.disabled=true;try{await req(DATA,"PATCH",{preferences:q});localStorage.setItem("fontSize",q.fontSize);localStorage.setItem("darkMode",String(q.theme==="dark"));document.documentElement.classList.toggle("dark-mode",q.theme==="dark");if(window.AccountI18n&&window.AccountI18n.setLanguage)window.AccountI18n.setLanguage(q.language);msg("Preferências salvas com sucesso.",false)}catch(e){msg("Não foi possível salvar as preferências. Tente novamente.",true)}finally{b.disabled=false}}}catch(e){console.error(e);$("settings-loading").textContent="Não foi possível carregar suas configurações. Tente novamente."}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
