<style>
:root{--navy:#1a3e74;--blue:#1e4d8c;--dark:#163269;--light:#eff6ff;--border:#dbe5f1;--text:#334155;--muted:#64748b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Inter",sans-serif;color:var(--text)}
button,input,select{font:inherit}
.meem-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 5px 16px rgba(26,62,116,.09)}
.meem-card-navy{position:relative;overflow:hidden;width:100%;border-radius:16px;color:#fff;background:linear-gradient(135deg,#1a3e74 0%,#1e4d8c 60%,#163269 100%);box-shadow:0 8px 24px rgba(26,62,116,.35)}
.meem-card-navy::before,.meem-card-navy::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.meem-card-navy::before{width:180px;height:180px;right:7%;top:-85px;background:rgba(255,255,255,.08);filter:blur(40px)}
.meem-card-navy::after{width:140px;height:140px;right:22%;bottom:-85px;background:rgba(74,144,226,.25);filter:blur(30px)}
.section-title{font-family:"Nunito Sans",sans-serif;color:var(--navy);font-size:clamp(1.15rem,2.4vw,1.55rem);font-weight:900;line-height:1.2}
.patient-body[hidden]{display:none}
.patient-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field-label{display:block;margin-bottom:5px;font-size:.78rem;font-weight:700;color:#475569}
.field-control{width:100%;min-height:44px;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff;color:#1e293b}
.field-control:focus,.answer-option:focus-within,button:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}
.progress-track{height:10px;overflow:hidden;border-radius:999px;background:#e2e8f0}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#4a90e2,#1a3e74);transition:width .2s ease}
.question-list{display:grid;gap:14px}
.question-card{margin:0;padding:16px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 3px 12px rgba(26,62,116,.07)}
.question-card legend{width:100%;padding:0;color:#1e293b;font-weight:700;font-size:.94rem;line-height:1.45}
.question-number{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border-radius:8px;background:var(--navy);color:#fff;font-size:.78rem}
.answer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.answer-option{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;cursor:pointer;color:#475569;font-size:.78rem;line-height:1.25;transition:border-color .15s,background .15s,transform .15s}
.answer-option:hover{border-color:#4a90e2;background:#eff6ff;transform:translateY(-1px)}
.answer-option:has(input:checked){border-color:var(--navy);background:#eaf2ff;color:var(--navy);font-weight:700}
.answer-option input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--navy)}
.button-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.compact-actions{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:-2px 0 18px;padding:2px 1px 8px;scrollbar-width:thin}
.compact-action{display:inline-flex;align-items:center;justify-content:center;min-height:38px;flex:0 0 auto;padding:7px 11px;border:1px solid #dbe5f1;border-radius:999px;background:#fff;color:#1a3e74;font-size:.72rem;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 2px 6px rgba(26,62,116,.06)}
.compact-action:hover{border-color:#4a90e2;background:#eff6ff}
.btn-primary,.btn-secondary{min-height:46px;border-radius:10px;padding:11px 22px;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn-primary{border:1px solid var(--navy);background:var(--navy);color:#fff;box-shadow:0 5px 14px rgba(26,62,116,.25)}
.btn-secondary{border:1px solid #cbd5e1;background:#fff;color:var(--navy)}
.btn-primary:hover,.btn-secondary:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(26,62,116,.2)}
.result-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:stretch}
.score-panel{display:grid;place-items:center;text-align:center;padding:24px;border-radius:14px;background:linear-gradient(145deg,#1a3e74,#163269);color:#fff}
.score-value{font-family:"Nunito Sans",sans-serif;font-size:clamp(3.2rem,9vw,5.4rem);font-weight:900;line-height:1}
.severity-panel{padding:22px}
.severity-badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:800}
.severity-minimal{background:#dcfce7;color:#166534}.severity-mild{background:#ecfccb;color:#3f6212}.severity-moderate{background:#fef3c7;color:#92400e}.severity-moderately-severe{background:#ffedd5;color:#9a3412}.severity-severe{background:#fee2e2;color:#991b1b}
.info-note{border-left:4px solid #4a90e2;border-radius:10px;background:#eff6ff;padding:14px;color:#334155}
.reference-list{padding-left:1.3rem;color:#374151;font-size:1rem;line-height:1.7}
.reference-list li+li{margin-top:14px}.reference-list a{color:#2563eb;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
@media(max-width:820px){.patient-grid,.answer-grid,.result-grid{grid-template-columns:1fr}.answer-option{font-size:.84rem}.score-panel{min-height:180px}}
@media(max-width:640px){.question-card{padding:13px}.button-row{display:grid;grid-template-columns:1fr}.btn-primary,.btn-secondary{width:100%}.hero-copy{text-align:left}.patient-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress-fill,.answer-option,.btn-primary,.btn-secondary{transition:none!important}}
@media print{.no-print,#global-header-container,#language-selector-placeholder,#footer-placeholder,.multiplex-ad-reserved{display:none!important}body{background:#fff!important}.print-area{display:block!important}.meem-card{box-shadow:none}.result-grid{grid-template-columns:180px 1fr}main{padding:0!important}}

/* Card GAD-7 conforme padrão MEEM: faixa de pontuação e microinterações acessíveis. */
.answer-option{min-width:0}.question-card{padding:15px;break-inside:avoid}.question-card:focus-within{border-color:#1a3e74}
.question-card .score-meter{height:5px;margin-top:9px;border-radius:6px;background:#e2e8f0;overflow:hidden}
.question-card .score-meter>span{display:block;height:100%;width:0;background:#16a34a;transition:width .15s}
.question-card[data-score="1"] .score-meter>span{background:#65a30d}.question-card[data-score="2"] .score-meter>span{background:#d97706}.question-card[data-score="3"] .score-meter>span{background:#e11d48}
.result-print-fallback{display:inline-block;border:1px solid #1a3e74;border-radius:8px;padding:9px 12px;margin-top:10px;color:#1a3e74;font-weight:700}.result-print-fallback[hidden]{display:none!important}
@media(max-width:820px){.answer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:430px){.answer-grid{grid-template-columns:1fr}.hero-copy{padding:24px 20px}}
@media(prefers-reduced-motion:reduce){.question-card .score-meter>span{transition:none}}
